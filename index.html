// "12 Sep 2026" -> 20260812 for sorting; Date parsing of this format varies by browser.
function dateKey(d) {
  const [day, mon, year] = String(d || "").trim().split(/\s+/);
  return Number(year) * 10000 + MONTH_ORDER.indexOf(mon) * 100 + Number(day) || 0;
}
const TX_PAGE = 100;
function renderTxns() {
  const f = ui.txFilter;
  const chip = (field, text) => `<button class="chip on" data-action="tx-unfilter" data-field="${field}" aria-label="Remove filter: ${esc(text)}">${esc(text)}${ICON(ICONS.close, 14)}</button>`;
  return `
  ${f ? `<div class="tx-filters">${f.label ? chip("label", f.label) : ""}${f.month ? chip("month", f.month) : ""}</div>` : ""}
  <input type="search" class="tx-search" id="tx-search" placeholder="Search description, category, account" value="${esc(ui.txQuery || "")}" autocomplete="off" aria-label="Search transactions">
  <div id="tx-list">${renderTxList()}</div>`;
}
function renderTxList() {
  const q = (ui.txQuery || "").trim().toLowerCase(), f = ui.txFilter;
  const months = periodMonths().filtered.filter(m => !f || !f.month || m.month === f.month);
  // A label filter keeps the rows its drill-down sheet listed, so fixed bills and flagged groups match too.
  const keys = f && f.label ? new Set(lineItems(months, f.bucket, f.label).map(r => r.key)) : null;
  const all = months.flatMap(m => (m.transactions || []).map((tx, i) => ({ ...tx, cat: resolveCategory(tx), key: txKey(m.month, i) })))
    .filter(tx => !keys || keys.has(tx.key))
    .filter(tx => !(ui.hideIncome && tx.deposit != null && currentRules().isSalary(tx.description)))
    .filter(tx => !q || [tx.description, tx.cat, accountLabel(tx.account)].some(v => String(v || "").toLowerCase().includes(q)))
    .sort((a, b) => dateKey(b.date) - dateKey(a.date));
  if (!all.length) return `<div style="font-size:14px;color:var(--text-2);padding:16px 0;">${q || f ? "No transactions match." : "No line items in this period. Months entered by hand have totals only."}</div>`;
  const out = all.reduce((s, t) => s + (t.withdrawal || 0), 0), inn = all.reduce((s, t) => s + (t.deposit || 0), 0);
  const shown = all.slice(0, ui.txLimit || TX_PAGE);
  let day = null;
  const rows = shown.map(tx => {
    const head = tx.date !== day ? `<div class="tx-day">${esc(tx.date)}</div>` : "";
    day = tx.date;
    const isIn = tx.deposit != null;
    const c = spendControls(tx.key, tx);
    const editable = oneOffModel().catKeys.has(tx.key);
    return `${head}<div class="tx-row">
      <div class="tx-main" ${editable ? `data-action="edit-spend" data-key="${esc(tx.key)}"` : ""}><div class="tx-desc">${esc(tx.description)}</div><div class="tx-meta">${esc(tx.cat)} &middot; ${esc(accountLabel(tx.account))}</div>${c.tag ? `<div class="tx-flags">${c.tag}</div>` : ""}</div>
      <span class="tx-amt ${isIn ? "in" : ""}">${isIn ? "+" : ""}${esc(fmt(isIn ? tx.deposit : tx.withdrawal))}</span>
    </div>${c.editor}`;
  }).join("");
  return `<div class="tx-summary">${all.length} transaction${all.length !== 1 ? "s" : ""} &middot; out ${esc(fmt(out))}${ui.hideIncome ? "" : ` &middot; in ${esc(fmt(inn))}`}</div>
  ${rows}
  ${all.length > shown.length ? `<div class="btn-row" style="justify-content:center;"><button class="btn" data-action="tx-more">Show ${Math.min(TX_PAGE, all.length - shown.length)} more</button></div>` : ""}`;
}

// Chrome's menu install can say "already installed" when another app on hariadityaa.github.io
// is installed. The page prompt checks this app's scope correctly, so offer it in the page.
const INSTALL_DECLINED = "duitbijak.installDeclined";
const pwa = { installEvent: null, installDeclined: false, updateReady: false };
try { pwa.installDeclined = localStorage.getItem(INSTALL_DECLINED) === "1"; } catch (e) {}
function isStandalone() { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pwa.installEvent = e; render(); });
window.addEventListener("appinstalled", () => { pwa.installEvent = null; render(); });

// A new deploy ships a new sw.js. It installs, takes over at once and fires
// controllerchange. The open page still runs the old code, so offer a reload.
// The installed app can sit in the background for days, so check on return.
const UPDATE_CHECK_MS = 30 * 60 * 1000;
function watchForUpdates() {
  if (!("serviceWorker" in navigator)) return;
  const sw = navigator.serviceWorker;
  // The first install also fires controllerchange. That is not an update.
  let hadController = !!sw.controller;
  sw.addEventListener("controllerchange", () => {
    if (hadController) { pwa.updateReady = true; render(); }
    hadController = true;
  });
  sw.register("sw.js").then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, UPDATE_CHECK_MS);
  }).catch(() => {});
}

let wired = false;
const OVER_IMPORT = new Set(["settings", "rules", "suggest", "accounts"]);
function wireOnce() {
  if (wired) return; wired = true;
  const root = document.getElementById("app");
  root.addEventListener("click", onClick);
  root.addEventListener("change", onChange);
  // Search re-renders only the list, so the input keeps focus and the keyboard stays up.
  root.addEventListener("input", e => {
    if (e.target.id !== "tx-search") return;
    ui.txQuery = e.target.value; ui.txLimit = 0;
    const list = document.getElementById("tx-list");
    if (list) list.innerHTML = renderTxList();

    if (e.key === "Escape" && (ui.sheet || ui.pdfImport) && !(ui.pdfImport && !OVER_IMPORT.has(ui.sheet))) { ui.sheet = null; render(); }
    else if (e.key === "Escape" && ui.drill.length && !ui.pdfImport) { closeDrill(1); render(); }
    // Rows that open a sheet are divs with role="button"; Enter and Space work as on a button.
    else if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
  });
  // Back closes the top drill-down sheet. Each open level pushed one history entry.
  // The page doesn't move under a sheet, so there's no scroll to restore, and restoring one fights "See all".
  try { history.scrollRestoration = "manual"; } catch (e) {}
  window.addEventListener("popstate", e => {
    const depth = (e.state && e.state.drill) || 0;
    if (depth < ui.drill.length) { ui.drill = ui.drill.slice(0, depth); ui.editTx = null; render(); }
  });
  // The FAB hides while scrolling down through content and returns on scroll up.
  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY, hide = y > lastY && y > 80;
    if (Math.abs(y - lastY) < 8) return;
    lastY = y;
    if (hide === fabHidden) return;

}

    btn.disabled = true; btn.textContent = "Importing…";
    const importedAt = new Date().toISOString();
    const records = st.files.filter(f => f.include).map(f => DuitStatements.recordFromImport(f, importedAt)).filter(Boolean);
    const found = DuitAccounts.register(appData.accounts, st.files.filter(f => f.include).flatMap(f => f.accounts || [])).added;
    persistAccounts(found).then(() => persistMonths(planImport(rows).months)).then(() => persistStatements(records)).then(() => {
      ui.pdfImport = null; ui.sheet = null; ui.syncError = null;
      if (!dbApi) ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
      showToast(`Imported ${rows.length} rows from ${fileCount} file${fileCount !== 1 ? "s" : ""}.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "save-month") {
    const v = id => document.getElementById(id);
    const month = (v("f-month").value || "").trim();
    if (!month) { showToast("Enter a month name first."); return; }
    const salary = Number(v("f-salaryIn").value) || 0, otherIn = Number(v("f-otherIn").value) || 0;
    const cardSpend = Number(v("f-cardSpend").value) || 0, giroOut = Number(v("f-giroOut").value) || 0, otherOut = Number(v("f-otherOut").value) || 0;
    const available = v("f-cardAvailable").value === "yes";
    const categories = {};
    CATEGORY_FIELDS.forEach(([key, label]) => { categories[label] = Number(v(`f-${key}`).value) || 0; });
    const newMonth = {
      month, salaryIn: salary, otherIn, totalIn: salary + otherIn,
      cardSpend: available ? cardSpend : null, cardSpendAvailable: available,
      giroOut, otherOut, totalOut: available ? cardSpend + giroOut + otherOut : round2(giroOut + otherOut),
      categories: available ? categories : null,
      giroCategories: {}, otherCategories: {}, topMerchants: [], transactions: [],
    };
    btn.disabled = true; btn.textContent = "Saving…";
    persistMonths([newMonth]).then(() => {
      ui.tab = "overview"; ui.sheet = null;
      if (!dbApi) ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
      showToast(`${month} saved.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "add-fixed") {
    const nameEl = document.getElementById("f-fixed-name");
    const amtEl = document.getElementById("f-fixed-amount");
    const name = (nameEl.value || "").trim();
    const amount = Number(amtEl.value);
    if (!name) { showToast("Enter a name first."); return; }
    if (!amount || amount <= 0) { showToast("Enter an amount."); return; }
    persistFixedCommitment(name, round2(amount)).then(() => {
      showToast(`${name} added.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "delete-fixed") {
    const name = btn.getAttribute("data-name");
    deleteFixedCommitment(name).then(() => render()).catch(err => { ui.syncError = "Couldn't delete that: " + err.message; render(); });
  }
}

/* ============================== init ============================== */
if (consumeSetupLink()) { ui.sheet = "settings"; showToast("Gemini key saved from setup link."); }
render();
initPersistence();
watchForUpdates();
})();
</script>
