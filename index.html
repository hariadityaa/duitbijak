<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duit Bijak — Finance Ledger</title>
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A local-only finance ledger. Nothing you enter leaves your browser.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-v3.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192-v3.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit Bijak">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Mono Dark design tokens — the single place colours, type, space and shape are defined. */
  :root{
    color-scheme:dark;
    --bg:#0a0a0a; --surface:#111111; --surface-2:#181818;
    --border:#262626; --border-strong:#3a3a3a;
    --text:#ededed; --text-2:#a1a1a1; --text-3:#6b6b6b;
    --accent:#ededed; --on-accent:#0a0a0a;
    --danger:#ef4444; --success:#22c55e; --focus:#ededed;
    /* chart ramp: the accent mixed into the card surface, brightest = largest */
    --chart-1:var(--accent);
    --chart-2:color-mix(in srgb, var(--accent) 80%, var(--surface));
    --chart-3:color-mix(in srgb, var(--accent) 64%, var(--surface));
    --chart-4:color-mix(in srgb, var(--accent) 52%, var(--surface));
    --chart-5:color-mix(in srgb, var(--accent) 42%, var(--surface));
    --chart-6:color-mix(in srgb, var(--accent) 34%, var(--surface));
    --chart-7:color-mix(in srgb, var(--accent) 28%, var(--surface));
    --chart-8:color-mix(in srgb, var(--accent) 23%, var(--surface));
    --chart-9:color-mix(in srgb, var(--accent) 19%, var(--surface));
    --chart-10:color-mix(in srgb, var(--accent) 16%, var(--surface));
    --font-sans:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --radius:8px; --radius-sm:6px; --radius-full:999px;
    --ease:150ms ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  body.sheet-open{ overflow:hidden; }
  body.sheet-open .fab{ display:none; }
  /* Aligned figures without monospace: Android has no ui-monospace, and its fallback spaces out commas */
  .num, .metric-value, .month-total, .row2-amt, .row2-total, .row2-delta, .item-date, .item-amt, .tx-amt, table.ledger{ font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-weight:600; line-height:1.25; text-wrap:balance; margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--on-accent); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  /* Bottom nav height, not counting the safe area below it */
  :root{ --nav-h:56px; --gutter:16px; }
  @media (min-width:640px){ :root{ --gutter:24px; } }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 var(--gutter) calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px); }

  /* Slim sticky header: title, income privacy toggle, settings */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin:0 calc(-1 * var(--gutter)) 16px; padding:calc(env(safe-area-inset-top) + 8px) var(--gutter) 8px;
    background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .app-title{ font-size:18px; font-weight:600; letter-spacing:-0.01em; color:var(--text); }
  .topbar-btns{ display:flex; gap:4px; }
  .icon-btn{
    width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    border:none; border-radius:var(--radius); background:transparent; color:var(--text-2); cursor:pointer;
    transition:background-color var(--ease), color var(--ease);
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }

  /* Bottom nav holds read-only destinations. Adding data is the FAB, not a tab. */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center;
    background:var(--surface); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-inner{ display:flex; width:100%; max-width:560px; }
  .nav-btn{
    flex:1; min-height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border:none; background:transparent; color:var(--text-3); font-size:12px; font-weight:500; cursor:pointer;
    transition:color var(--ease);
  }
  .nav-btn.active{ color:var(--text); font-weight:600; }
  .fab{
    position:fixed; z-index:31; right:max(var(--gutter), calc((100vw - 1120px) / 2 + var(--gutter)));
    bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    width:56px; height:56px; border-radius:16px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:var(--on-accent); box-shadow:0 4px 16px rgba(0,0,0,.5);
    transition:transform 200ms ease, opacity 200ms ease;
  }
  .fab.hidden{ transform:translateY(24px); opacity:0; pointer-events:none; }

  /* Bottom sheet for actions: add data, PDF review, settings */
  .sheet-backdrop{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{
    width:100%; max-width:640px; max-height:90vh; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:16px 16px 0 0;
    padding:0 var(--gutter) calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.enter{ animation:sheet-in 200ms ease; }
  @keyframes sheet-in{ from{ transform:translateY(32px); opacity:0; } }
  .sheet-head{ position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 0; margin-bottom:8px; background:var(--surface); border-bottom:1px solid var(--border); }
  .sheet-head h2{ font-size:16px; }
  .sheet .card{ background:none; border:none; padding:0; margin:0 0 16px; }
  .sheet .card > .card-title:first-child{ display:none; }
  .action-row{
    display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:8px; cursor:pointer;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); color:var(--text);
    font-size:15px; font-weight:600; transition:border-color var(--ease);
  }
  .action-row:hover{ border-color:var(--border-strong); }
  .action-row span{ display:block; font-size:13px; font-weight:400; color:var(--text-2); margin-top:2px; }
  .settings-meta{ font-size:14px; color:var(--text-2); margin:0 0 16px; line-height:1.5; }

  /* Period presets */
  .chips{ display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; margin-bottom:8px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    height:32px; padding:0 14px; flex-shrink:0; border-radius:var(--radius-full); border:1px solid var(--border);
    background:transparent; color:var(--text-2); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .chip.on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .period-range{ font-size:13px; color:var(--text-2); margin-bottom:16px; }

  .card.nudge{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-color:var(--border-strong); background:var(--surface-2); }
  .card.nudge p{ margin:0; font-size:14px; color:var(--text-2); line-height:1.5; flex:1 1 200px; }
  .card.nudge strong{ color:var(--text); }

  /* Transactions tab */
  .tx-search{ width:100%; margin-bottom:8px; }
  .tx-filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .tx-filters .chip{ display:inline-flex; align-items:center; gap:4px; }
  .stacked-bar .seg[data-action]{ cursor:pointer; }
  .metric.clickable{ margin:0; padding:16px; cursor:pointer; }
  .metric.clickable:hover, .metric.clickable:active{ border-color:var(--border-strong); background:var(--surface); }
  .metric-label .chev{ float:right; margin:0; }
  .drill-more{ margin-top:16px; }
  .tx-summary{ font-size:13px; color:var(--text-2); margin-bottom:8px; }
  .tx-day{ font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; padding:16px 0 4px; border-bottom:1px solid var(--border); }
  .tx-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .tx-main{ flex:1; min-width:0; }
  .tx-desc{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-meta{ font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-amt{ font-size:14px; font-weight:500; white-space:nowrap; flex-shrink:0; }
  .tx-amt.in{ color:var(--success); }
  .tx-main[data-action], .item-desc[data-action]{ cursor:pointer; }
  .tx-flags, .item-flags{ margin-top:4px; }
  .item-flags{ padding-bottom:8px; }
  .flag-tag{ font:inherit; font-size:12px; padding:0 8px; border-radius:var(--radius-full); border:1px solid var(--border-strong); background:transparent; color:var(--text); cursor:pointer; }
  .suggest{ display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); padding:0 0 0 8px; border:1px dashed var(--border-strong); border-radius:var(--radius-full); }
  .link-btn{ font:inherit; font-size:12px; background:none; border:none; padding:2px 8px; color:var(--text); text-decoration:underline; cursor:pointer; }
  .spend-editor{ padding:8px 0 12px; border-bottom:1px solid var(--border); }
  .spend-editor .toggle-row{ margin-bottom:8px; }
  .spend-cat{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); margin-bottom:8px; }
  .spend-cat select{ flex:1; min-width:0; }
  .spend-life{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); }
  .spend-life input{ width:80px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; line-height:1;
    height:40px; padding:0 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); cursor:pointer; white-space:nowrap;
    transition:background-color var(--ease), border-color var(--ease), color var(--ease), opacity var(--ease);
  }
  .btn:hover:not(:disabled){ background:var(--border); border-color:var(--border-strong); }
  .btn.primary, .btn.on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled), .btn.on:hover:not(:disabled){ background:var(--accent); border-color:var(--accent); opacity:.88; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-2); }
  .btn.ghost:hover:not(:disabled){ background:var(--surface-2); border-color:transparent; color:var(--text); }
  .btn.danger{ color:var(--danger); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.small{ padding:0 12px; min-width:40px; }

  .banner{
    display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius);
    font-size:14px; line-height:1.5; margin-bottom:16px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-2);
  }
  .banner svg{ flex-shrink:0; margin-top:2px; }
  .banner.error svg{ color:var(--danger); }
  .banner strong{ color:var(--text); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  @media (min-width:640px){ .card{ padding:24px; } }
  .card-title{
    font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em;
    margin:0 0 16px; padding-bottom:12px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .section-label{ font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; margin:24px 0 12px; }

  .metrics{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; margin-bottom:24px; }
  @media (min-width:900px){ .metrics{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .metric{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .metric-sub .ok{ color:var(--success); }
  .metric-sub .warn{ color:var(--danger); }
  .metric-label{ font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-bottom:4px; }
  .metric-value{ font-size:22px; font-weight:600; letter-spacing:-.02em; line-height:1.25; }
  .metric-sub{ font-size:12px; color:var(--text-2); margin-top:4px; }

  .toggle-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .toggle-row .total{ font-size:14px; color:var(--text-2); margin-left:4px; }
  .toggle-row .total strong{ color:var(--text); }

  .legend{ display:flex; flex-wrap:wrap; gap:12px 16px; margin-bottom:12px; font-size:12px; color:var(--text-2); }
  .legend span.sw{ width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:8px; flex-shrink:0; border:1px solid var(--border-strong); }
  .legend-item{ display:flex; align-items:center; }

  .swatch{ width:12px; height:12px; border-radius:4px; flex-shrink:0; border:1px solid var(--border-strong); }

  .month-row{ padding:12px 0; border-bottom:1px solid var(--border); }
  .month-row:last-child{ border-bottom:none; }
  .month-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px; }
  .month-label{ font-size:14px; font-weight:600; }
  .month-total{ font-size:14px; color:var(--text-2); }
  .stacked-bar{ display:flex; height:16px; border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-2); }
  .stacked-bar .seg{ height:100%; min-width:2px; }
  .stacked-bar.empty{ background:var(--surface-2); }

  .row2{ padding:12px 0; border-bottom:1px solid var(--border); }
  .row2:last-child{ border-bottom:none; }
  .row2-top{ display:flex; align-items:center; gap:12px; }
  .row2-name{ flex:1; min-width:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row2-amt{ font-size:16px; font-weight:600; white-space:nowrap; flex-shrink:0; }
  .row2-amt small{ font-size:12px; font-weight:400; color:var(--text-2); }
  .row2-bottom{ display:flex; align-items:center; gap:12px; margin-top:8px; }
  .row2-bar{ flex:1; height:8px; background:var(--surface-2); border-radius:var(--radius-sm); overflow:hidden; min-width:24px; }
  .row2-bar-fill{ height:100%; border-radius:var(--radius-sm); }
  .row2-total{ font-size:12px; color:var(--text-2); white-space:nowrap; flex-shrink:0; }
  .row2-delta{ font-size:12px; font-weight:500; white-space:nowrap; flex-shrink:0; }
  .row2-delta.up{ color:var(--danger); } .row2-delta.down{ color:var(--success); } .row2-delta.flat{ color:var(--text-2); }
  .tag{ font-size:12px; margin-left:8px; padding:0 8px; border-radius:var(--radius-full); border:1px solid var(--border-strong); color:var(--text-2); font-weight:500; }
  .clickable{ cursor:pointer; margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:var(--radius-sm); transition:background-color var(--ease); }
  .clickable:hover, .clickable:active{ background:var(--surface-2); }
  .chev{ display:inline-flex; color:var(--text-3); flex-shrink:0; margin-left:-4px; }
  .month-total-wrap{ display:flex; align-items:center; gap:4px; }

  /* Drill-down sheets: a month, or a category over the period */
  .sheet-head-l{ display:flex; align-items:center; gap:4px; min-width:0; }
  .sheet-head-l h2{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-head-l .icon-btn{ margin-left:-8px; }
  .drill-head{ margin:4px 0 16px; }
  .drill-total{ font-size:28px; font-weight:600; letter-spacing:-.02em; line-height:1.2; font-variant-numeric:tabular-nums; }
  .drill-sub{ font-size:14px; color:var(--text-2); margin-top:4px; }
  .drill-sub .up{ color:var(--danger); } .drill-sub .down{ color:var(--success); }
  .row2-delta.save.up{ color:var(--success); } .row2-delta.save.down{ color:var(--danger); }
  .drill-stats{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:16px; }
  .drill-stat{ background:var(--surface-2); border-radius:var(--radius); padding:8px 12px; }
  .drill-stat span{ display:block; font-size:12px; color:var(--text-2); }
  .drill-stat strong{ font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .drill-section{ font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin:16px 0 4px; }
  .drill-trend{ display:flex; align-items:flex-end; gap:6px; height:104px; margin:4px 0 8px; overflow-x:auto; scrollbar-width:none; }
  .drill-trend::-webkit-scrollbar{ display:none; }
  .drill-trend .tb{ flex:1 0 28px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; padding:0; border:none; background:none; color:var(--text-2); font:inherit; font-size:11px; cursor:pointer; }
  .drill-trend .tb b{ font-weight:500; font-size:10px; color:var(--text-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .drill-trend .tb i{ display:block; width:100%; max-width:28px; min-height:2px; border-radius:3px 3px 0 0; background:var(--text-3); }
  .drill-trend .tb.on{ color:var(--text); font-weight:600; }
  .drill-trend .tb.on i{ background:var(--text); }
  .drill-trend .tb:disabled{ cursor:default; }
  .drill-list .item-date{ min-width:48px; }
  .drill-month{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; padding:16px 0 4px; border-bottom:1px solid var(--border); }


  .items{ padding:0; }
  .item-row{ display:flex; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .out-note{ display:block; font-size:12px; color:var(--text-2); white-space:normal; }
  .out-total{ font-weight:600; border-bottom:none; }
  .item-row:last-child{ border-bottom:none; }
  .item-date{ color:var(--text-2); font-size:12px; white-space:nowrap; }
  .item-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-amt{ font-weight:500; white-space:nowrap; }
  .guess{ color:var(--text-2); }

  .period-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .period-bar label{ font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  select, input[type=text], input[type=search], input[type=number], input[type=password], textarea{
    font-family:inherit; font-size:14px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius); padding:0 12px; height:40px;
    transition:border-color var(--ease);
  }
  textarea{ height:auto; padding:12px; }
  select:hover, input:hover, textarea:hover{ border-color:var(--border-strong); }
  input::placeholder, textarea::placeholder{ color:var(--text-3); }

  .empty-state{ text-align:center; padding:48px 16px; }
  .empty-state h2{ font-size:20px; margin-bottom:8px; }
  .empty-state p{ color:var(--text-2); font-size:16px; max-width:440px; margin:0 auto 24px; line-height:1.5; }

  textarea.paste-area{ width:100%; min-height:160px; resize:vertical; font-family:var(--font-mono); font-size:12px; }
  .paste-help{ font-size:14px; color:var(--text-2); line-height:1.5; margin:0 0 12px; }
  .btn-row{ display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }

  .pdf-file{ padding:12px 0; border-top:1px solid var(--border); }
  .pdf-head{ display:flex; align-items:center; gap:8px; font-size:14px; min-height:40px; cursor:pointer; overflow-wrap:anywhere; }
  .pdf-head input{ width:16px; height:16px; flex-shrink:0; accent-color:var(--accent); }
  .pdf-meta{ font-size:12px; color:var(--text-2); margin:0 0 8px 24px; }
  .pdf-meta strong{ color:var(--danger); font-weight:500; }

<body>

<div class="wrap" id="app"></div>
<div id="toast-holder"></div>

<script src="accounts.js"></script>
<script src="pdf-import.js"></script>
<script src="gemini-parse.js"></script>
<script src="categorise.js"></script>
<script src="statements.js"></script>
<script src="rules.js"></script>
<script src="backup.js"></script>
<script>
(function(){
"use strict";

/* ============================== constants ============================== */
const STORAGE_KEY = "duit-bijak-finance-ledger-v1";
const MONTH_ORDER = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const CATEGORY_FIELDS = [
  ["cat_shopping","Shopping/Online"], ["cat_dining","Dining & Food"], ["cat_transport","Transport"],
  ["cat_sports","Sports"], ["cat_home","Home & Furniture"], ["cat_groceries","Groceries"],
  ["cat_services","Services"], ["cat_electronics","Electronics"], ["cat_subscriptions","Subscriptions"],
  ["cat_travel","Travel"], ["cat_fashion","Fashion"], ["cat_utilities","Utilities"], ["cat_convenience","Convenience Stores"],
  ["cat_other","Other"],
];

// Statement types. "Other …" are statements read by Gemini (gemini-parse.js).
// Bank vs card comes from the account id (accounts.js), e.g. card-dbs-5678.
const isBankAccount = id => DuitAccounts.kindOf(id) === "bank";
const isCardAccount = id => DuitAccounts.kindOf(id) === "card";
const accountLabel = id => DuitAccounts.accountName(id, appData.accounts);
const sourceLabel = src => DuitAccounts.sourceName(src, appData.accounts);
// Category rules and history matching live in categorise.js. Fixed bills,
// salary, one-offs, card bill payments and transfers are the user's own rules
// (rules.js, edited in Settings), saved with the ledger.

/* ============================== utilities ============================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => { if (n == null || isNaN(n)) return "—"; const r = Math.round(n); return r < 0 ? `-$${Math.abs(r).toLocaleString()}` : `$${r.toLocaleString()}`; };
const pct = (a, b) => b ? ((a - b) / b * 100).toFixed(0) : null;
function hashColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return `var(--chart-${(Math.abs(h) % 10) + 1})`;
}
// Assigns colors by rank (order of `names`) instead of a hash, so the handful of
// categories in any one view get visually distinct colors instead of colliding.
function colorMap(names) {
  const map = {};
  names.forEach((n, i) => { if (!(n in map)) map[n] = `var(--chart-${(i % 10) + 1})`; });
  return name => map[name] || hashColor(name);
}

/* ============================== CSV / TSV parsing ============================== */
function parseCsv(text, delimiter) {
  delimiter = delimiter || ",";
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delimiter) { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some(f => f !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function detectDelimiter(text) {
  const firstLine = text.split(/\r?\n/).find(l => l.trim() !== "") || "";
  const tabs = (firstLine.match(/\t/g) || []).length;
  const commas = (firstLine.match(/,/g) || []).length;
  return tabs > commas ? "\t" : ",";
}
function parseSheetTransactions(csvText) {
  const rows = parseCsv(csvText, detectDelimiter(csvText));
  const headerIdx = rows.findIndex(r => (r[0] || "").trim() === "Statement File");
  if (headerIdx === -1) throw new Error('No "Statement File" header found. Paste the full table, starting with its header row.');
  const out = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const file = (r[0] || "").trim();
    if (!file || file === "File ID") break;
    const bank = (r[1] || "").trim();
    const date = (r[2] || "").trim();
    const description = (r[3] || "").trim();
    const amount = parseFloat((r[4] || "0").replace(/,/g, ""));
    const type = (r[5] || "").trim().toUpperCase();
    const category = (r[6] || "").trim();
    if (!date || !bank) continue;
    out.push({ file, bank, date, description, amount: isNaN(amount) ? 0 : amount, type, category });
  }
  if (!out.length) throw new Error("No transaction rows found under the header.");
  return out;
}
function classifyFile(rows) {
  // Salary and fixed bills only arrive in a bank account, so either marks one.
  const text = rows.map(r => r.description).join(" | ");
  const c = currentRules();
  if (/One Account/i.test(text) || rows.some(r => c.isSalary(r.description) || c.fixedBillFor(r.description))) return "UOB One";
  const bank = rows[0] && rows[0].bank;
  if (bank === "POSB") return "POSB";
  if (bank === "DBS") return "DBS CC";
  if (bank === "UOB") return "UOB Card";
  return "Unknown";
}
// Rebuilt whenever appData.months is replaced, so a new import or sync
// teaches the next guess. Only saved (hand-set or imported) labels count.
let categoryHistoryFor = null, categoryHistory = new Map();
function currentCategoryHistory() {
  if (categoryHistoryFor !== appData.months) {
    categoryHistoryFor = appData.months;
    categoryHistory = DuitCategorise.buildCategoryHistory(appData.months.flatMap(m => m.transactions || []));
  }
  return categoryHistory;
}
// Recompiled whenever appData.rules is replaced (a save or a sync).
let rulesFor, compiledRules = null;
function currentRules() {
  if (!compiledRules || rulesFor !== appData.rules) { rulesFor = appData.rules; compiledRules = DuitRules.compileRules(appData.rules); }
  return compiledRules;
}
const classifyOpex = description => DuitCategorise.classifyOpex(description, currentCategoryHistory());
const resolveCategory = tx => DuitCategorise.resolveCategory(tx.description, tx.category, currentCategoryHistory());
function monthKeyFromDate(dateStr) {
  const parts = dateStr.trim().split(" ");
  if (parts.length < 3) return null;
  return `${parts[1]} ${parts[2]}`;
}

/* ============================== aggregation ============================== */
function buildMonths(cleanRows) {
  const rules = currentRules();
  const byMonth = {};
  cleanRows.forEach(tx => {
    const month = monthKeyFromDate(tx.date);
    if (!month) return;
    (byMonth[month] = byMonth[month] || []).push(tx);
  });
  const months = {};
  Object.entries(byMonth).forEach(([month, txs]) => {
    const bankTxs = txs.filter(t => isBankAccount(t.account));
    const cardTxs = txs.filter(t => isCardAccount(t.account));
    let salaryIn = 0, otherIn = 0, giroOut = 0, otherOut = 0, cardSpend = 0;
    const giroCategories = {};
    const otherCategories = {};
    const categories = {};
    const merchantTotals = {};

    bankTxs.forEach(tx => {
      const route = DuitRules.routeBankTx(tx, rules);
      if (route.kind === "skip") return;
      if (route.kind === "fixed") { giroOut += tx.amount; giroCategories[route.name] = round2((giroCategories[route.name] || 0) + tx.amount); return; }
      if (route.kind === "salary") { salaryIn += tx.amount; return; }
      if (route.kind === "otherIn") { otherIn += tx.amount; return; }
      const label = resolveCategory(tx);
      if (label === "Credit Card Payment") return;
      if (rules.isOneOff(label)) { otherOut += tx.amount; otherCategories[label] = round2((otherCategories[label] || 0) + tx.amount); }
      else { cardSpend += tx.amount; categories[label] = round2((categories[label] || 0) + tx.amount); }
    });

    cardTxs.forEach(tx => {
      if (DuitRules.routeCardTx(tx, rules).kind === "skip") return;
      const signed = tx.type === "DR" ? tx.amount : -tx.amount;
      const cat = resolveCategory(tx);
      if (cat === "Credit Card Payment") return;
      if (rules.isOneOff(cat)) { otherOut += signed; otherCategories[cat] = round2((otherCategories[cat] || 0) + signed); }
      else {
        cardSpend += signed; categories[cat] = round2((categories[cat] || 0) + signed);
        const merchant = tx.description || "Unknown";
        merchantTotals[merchant] = round2((merchantTotals[merchant] || 0) + signed);
      }
    });

    const topMerchants = Object.entries(merchantTotals).filter(([, a]) => a > 0).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([name, amt]) => ({ name, amt }));
    const allTx = txs.map(t => ({ date: t.date, account: t.account, description: t.description, withdrawal: t.type === "DR" ? t.amount : null, deposit: t.type === "CR" ? t.amount : null, category: t.category || null, file: t.file || null, ...spendFlags(t) }))
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    months[month] = {
      month, salaryIn: round2(salaryIn), otherIn: round2(otherIn), totalIn: round2(salaryIn + otherIn),
      cardSpend: round2(cardSpend), cardSpendAvailable: cardTxs.length > 0,
      giroOut: round2(giroOut), otherOut: round2(otherOut), totalOut: round2(cardSpend + giroOut + otherOut),
      giroCategories, categories: cardTxs.length > 0 ? categories : null, otherCategories, topMerchants, transactions: allTx,
      catVersion: DuitCategorise.CATEGORISER_VERSION,
    };
  });
  return months;
}
function sortMonthKeys(keys) {
  return keys.sort((a, b) => {
    const [am, ay] = a.split(" "), [bm, by] = b.split(" ");
    return ay !== by ? Number(ay) - Number(by) : MONTH_ORDER.indexOf(am) - MONTH_ORDER.indexOf(bm);
  });
}
function syncFromText(csvText) {
  return syncFromRows(keepSpendFlags(parseSheetTransactions(csvText)));
}
// Rows from the PDF parsers already know their account. Only rows without
// one (CSV and paste) fall back to guessing it from descriptions, as an
// account with no number (bank-uob).
function syncFromRows(rawRows) {
  const byFile = {};
  rawRows.forEach(r => { if (!r.account) (byFile[r.file] = byFile[r.file] || []).push(r); });
  const fileAccount = {};
  Object.entries(byFile).forEach(([file, rows]) => {
    const type = classifyFile(rows);
    fileAccount[file] = DuitAccounts.isLegacy(type) ? DuitAccounts.fromLegacy(type).id : type;
  });
  const clean = rawRows.map(r => ({ ...r, account: r.account || fileAccount[r.file] }));
  const monthTotals = buildMonths(clean);
  const monthKeys = sortMonthKeys(Object.keys(monthTotals));
  return monthKeys.map(k => monthTotals[k]);
}

// PDFs arrive a statement at a time, and a card statement spans two months,
// so a PDF import can't replace whole months the way a full CSV does. Each
// touched month is rebuilt from its saved transactions plus the new rows
// (accounts.js mergeMonth: same-file rows are replaced, older rows matched
// one for one, categories carried over).
const txToRow = DuitAccounts.txToRow;
// A CSV or paste replaces whole months. One-off flags set in the app aren't in
// the file, so carry them over from saved rows that match.
function keepSpendFlags(rows) {
  const flagged = appData.months.flatMap(m => (m.transactions || []).filter(tx => tx.spendType || tx.suggestDismissed).map(txToRow));
  if (flagged.length) DuitAccounts.matchOldRows(rows, flagged, true);
  return rows.map(({ matched, ...r }) => r);
}
function planImport(newRows) {
  const files = new Set(newRows.map(r => r.file));
  const existing = {}; appData.months.forEach(m => { existing[m.month] = m; });
  const byMonth = {};
  newRows.forEach(r => { const k = monthKeyFromDate(r.date); if (k) (byMonth[k] = byMonth[k] || []).push({ ...r }); });
  const rows = [], manual = [];
  let replaced = 0;
  Object.entries(byMonth).forEach(([month, incoming]) => {
    const prev = existing[month];
    if (prev && !(prev.transactions || []).length) manual.push(month);
    const merged = DuitAccounts.mergeMonth(prev ? prev.transactions : [], incoming, files);
    replaced += merged.replaced;
    rows.push(...merged.rows);
  });
  return { months: syncFromRows(rows), monthKeys: sortMonthKeys(Object.keys(byMonth)), manual, replaced };
}
// Months keep the totals worked out at import, so changed rules only show
// once each imported month is rebuilt from its saved rows. Months entered by
// hand have no rows and keep their totals.
function rebuildMonths() {
  const rows = appData.months.flatMap(m => (m.transactions || []).map(txToRow));
  return rows.length ? syncFromRows(rows) : [];
}
// Months built by older category rules are rebuilt once, so new rules reach
// the saved totals. With db, waits for the rules so the rebuild uses them.
let rulesLoaded = false;
function refreshStaleMonths() {
  if (!rulesLoaded) return;
  const stale = appData.months.some(m => (m.transactions || []).length && m.catVersion !== DuitCategorise.CATEGORISER_VERSION);
  if (!stale) return;
  const rebuilt = rebuildMonths();
  if (rebuilt.length) persistMonths(rebuilt).then(() => render()).catch(err => { ui.syncError = "Couldn't update categories: " + err.message; render(); });
}
function opexLineItems(months, category) {
  const rules = currentRules();
  const rows = [];
  months.forEach(m => {
    if (!m.cardSpendAvailable) return;
    (m.transactions || []).forEach((tx, i) => {
      if (rules.isTransfer(tx.description) || rules.isCardBill(tx.description) || rules.fixedBillFor(tx.description)) return;
      const isBank = isBankAccount(tx.account);
      if (isBank && tx.withdrawal == null) return;
      const amount = tx.withdrawal != null ? tx.withdrawal : -(tx.deposit || 0);
      if (!amount) return;
      const resolvedCat = resolveCategory(tx);
      if (resolvedCat !== category) return;
      rows.push({ ...tx, amount, month: m.month, guessed: !tx.category, key: txKey(m.month, i) });
    });
  });
  return rows.sort((a, b) => b.amount - a.amount);
}
/* ============================== one-off spend ==============================
   Rows flagged asset, prepaid or exceptional (see categorise.js). Saved month
   totals stay cash. Core op-ex is worked out here: a flagged row leaves its
   month, and a prepaid row comes back as an even share in each
   month it's spread over. Total Out stays cash. */
const SPEND_TYPES = DuitCategorise.SPEND_TYPES;
const FLAG_GROUPS = { asset: "Assets", prepaid: "Prepaid", exceptional: "Exceptional" };
function spendFlags(t) {
  const out = {};
  const type = DuitCategorise.canonSpendType(t.spendType);
  if (SPEND_TYPES[type]) { out.spendType = type; if (Number(t.life) > 0) out.life = Number(t.life); }
  if (t.suggestDismissed) out.suggestDismissed = true;
  return out;
}
// What a saved row adds to its month's op-ex, mirroring buildMonths; null if it isn't op-ex.
function opexRowAmount(tx, cat) {
  const rules = currentRules();
  if (cat === "Credit Card Payment" || rules.isOneOff(cat)) return null;
  const row = { description: tx.description, type: tx.withdrawal != null ? "DR" : "CR" };
  if (isCardAccount(tx.account)) return DuitRules.routeCardTx(row, rules).kind === "skip" ? null : (tx.withdrawal != null ? tx.withdrawal : -(tx.deposit || 0));
  if (isBankAccount(tx.account) && DuitRules.routeBankTx(row, rules).kind === "spend") return tx.withdrawal;
  return null;
}
const txKey = (month, idx) => `${month}|${idx}`;
// Spend rows take a category; transfers, card bills, fixed bills and income don't.
function canRecategorise(tx) {
  const rules = currentRules();
  const row = { description: tx.description, type: tx.withdrawal != null ? "DR" : "CR" };
  if (isCardAccount(tx.account)) return DuitRules.routeCardTx(row, rules).kind !== "skip";
  return isBankAccount(tx.account) && DuitRules.routeBankTx(row, rules).kind === "spend";
}
// Every label a row can be given: the built-in ones plus the user's one-off categories.
function categoryOptions() {
  const skip = new Set(["Credit Card Payment", "Interest Income"]);
  const labels = [...DuitCategorise.OPEX_MATCH_RULES.map(r => r.cat), ...CATEGORY_FIELDS.map(f => f[1]), ...currentRules().rules.oneOffCategories, ...currentRules().rules.savingsCategories, ...DuitRules.BUILT_IN_ONE_OFF];
  return [...new Set(labels)].filter(l => !skip.has(l)).sort((a, b) => a.localeCompare(b));
}
// Rebuilt when the months or the rules are replaced.
let oneOffFor = null, oneOffRules = null, oneOff = null;
function oneOffModel() {
  if (oneOff && oneOffFor === appData.months && oneOffRules === appData.rules) return oneOff;

/* Total out, taken apart so the parts add up to it. Core op-ex isn't cash:
   it carries spread shares of earlier buys and leaves flagged rows out, so
   the bridge takes the shares off and puts the one-offs back. Whole dollars,
   with the spread as the remainder, so the shown figures sum exactly. */
function outBreakdown(months) {

    total += out; fixed += m.giroOut || 0; saved += saving; ruleOneOffs += (m.otherOut || 0) - saving; oneOffs += paid;
    if (m.cardSpendAvailable) { core += opexAmount(m); confirmedMonths++; }
    else noCard += out - (m.giroOut || 0) - (m.otherOut || 0) - paid;

/* ============================== persistence ==============================
   Two layers: the `db` capability (a shared, realtime store scoped to this
   artifact) when the viewer grants it — this only applies if the page is
   ever embedded inside a Claude artifact viewer. Falls back to this
   browser's localStorage otherwise, which is the normal path when this
   page is hosted as a plain static site (e.g. GitHub Pages): there is no
   server and no account system here, so every visitor's data lives only
   in their own browser and is never sent anywhere. One document per month

let dbApi = null;

// totals. Fold them into the current ones as they load.
// Old one-off types are folded in too: "capital" is now "asset", which no longer spreads.
const canonTx = t => t.spendType && DuitCategorise.canonSpendType(t.spendType) !== t.spendType ? { ...t, spendType: DuitCategorise.canonSpendType(t.spendType) } : t;

const emptyData = () => ({ months: [], fixedCommitments: {}, statements: {}, rules: null, accounts: {} });
function loadLocal() {

  } catch (e) {}

}
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (e) {} }

let appData = emptyData();
let ui = {

  bucketOverview: "opex",
  drill: [], drillSort: "date", // drill-down sheets, top last: { kind: "month" | "cat", bucket, month, cat }
  sheet: null, // null | "add" | "paste" | "month" | "settings" | "rules" | "suggest" | "statements" | "accounts"
  rulesDraft: null, suggestions: null, // rule edits wait here until saved
  customPeriod: false, txQuery: "", txLimit: 0, syncError: null, lastSynced: null,
  txFilter: null, // { month, bucket, label }: set from a drill-down sheet's "See all"

function applySnapshotMonths(rawMonths) {

// Data saved before accounts existed names accounts by statement type.
// Rewritten once, in place (accounts.js migrate is idempotent, so a synced

function migrateLoaded() {

  if (!res.changed) return;

  appData.months = res.months; appData.statements = res.statements; appData.accounts = res.accounts;
  if (!dbApi) { saveLocal(); return; }

    ...months.map(m => dbApi.collection("months").doc(docIdForMonth(m.month)).set(m)),
    ...res.removedStatements.map(id => dbApi.collection("statements").doc(id).delete()),
    ...records.map(r => dbApi.collection("statements").doc(r.id).set(r)),
    ...res.addedAccounts.map(a => dbApi.collection("accounts").doc(a.id).set(a)),

  } else {

// segAttrs(name) adds attributes to a segment, e.g. to make it tappable.
function stackedBar(entries, total, colorOf, segAttrs) {
  colorOf = colorOf || hashColor;
  if (!entries.length || total <= 0) return `<div class="stacked-bar empty"></div>`;
  const segs = entries.map(([name, val]) => {
    if (val <= 0) return "";
    const w = (val / total * 100).toFixed(2);
    return `<div class="seg" style="width:${w}%;background:${colorOf(name)}" title="${esc(name)}: ${esc(fmt(val))}" ${segAttrs ? segAttrs(name) : ""}></div>`;
  }).join("");
  return `<div class="stacked-bar">${segs}</div>`;
}

// The sheet keeps its scroll position across re-renders (PDF progress,
// toggling rows), and only animates in when it first opens.
let lastSheetKey = null;
function render() {
  const root = document.getElementById("app");
  const oldSheet = root.querySelector(".sheet");
  const sheetScroll = oldSheet ? oldSheet.scrollTop : 0;
  const sheet = renderSheet();
  root.innerHTML = renderHeader() + renderBody() + renderNav() + sheet.html;
  const el = root.querySelector(".sheet");
  if (el) { if (sheet.key === lastSheetKey) el.scrollTop = sheetScroll; else el.classList.add("enter"); }
  lastSheetKey = sheet.key;
  document.body.classList.toggle("sheet-open", !!sheet.key);
  wireOnce();
}

// Which sheet shows. Settings and its rules sit over a PDF review, so a key
// can be added mid-import and closing Settings returns to the review.
function renderSheet() {
  let key = null, title = "", body = "", closable = true, back = false;
  if (ui.sheet === "settings") { key = "settings"; title = "Settings"; body = renderSettings(); }
  else if (ui.sheet === "rules" && ui.rulesDraft) { key = "rules"; title = "Transaction rules"; body = renderRules(); }
  else if (ui.sheet === "accounts") { key = "accounts"; title = "Accounts"; body = renderAccounts(); }
  else if (ui.sheet === "suggest" && ui.rulesDraft) { key = "suggest"; title = "Suggested fixed bills"; body = renderSuggestions(); }
  else if (ui.pdfImport) { key = "pdf"; title = "Review PDF import"; body = renderPdfReview(); closable = false; }
  else if (ui.sheet === "add") { key = "add"; title = "Add data"; body = renderAddMenu(); }
  else if (ui.sheet === "paste") { key = "paste"; title = "Paste or upload a table"; body = renderPastePanel(); }
  else if (ui.sheet === "month") { key = "month"; title = "Enter a month by hand"; body = renderAddMonth(); }
  else if (ui.sheet === "statements") { key = "statements"; title = "Statements"; body = renderStatements(); }
  else if (ui.sheet === "review" && appData.months.length) { key = "review"; title = "One-offs to review"; body = renderReview(); }
  else if (ui.sheet === "out" && appData.months.length) { key = "out"; title = `Total out · ${periodLabel(periodMonths().filtered)}`; body = renderOutSheet(); }
  else if (ui.drill.length && appData.months.length) {
    const d = ui.drill[ui.drill.length - 1];
    // The month filter isn't in the key, so picking a month keeps the scroll and skips the animation.
    key = `drill:${ui.drill.length}:${d.kind}:${d.kind === "cat" ? d.cat : d.month}`;
    back = ui.drill.length > 1;
    if (d.kind === "month") { title = `${d.month} · ${BUCKET_LABEL[d.bucket]}`; body = renderMonthDrill(d); }
    else { title = `${d.cat} · ${d.month || periodLabel(periodMonths().filtered)}`; body = renderCatDrill(d); }
  }
  if (!key) return { key: null, html: "" };
  const error = ui.syncError ? `<div class="banner error">${WARN_ICON}<span>${esc(ui.syncError)}</span></div>` : "";
  return { key, html: `
  <div class="sheet-backdrop" ${closable ? 'data-action="close-sheet"' : ""}>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-head"><div class="sheet-head-l">${back ? `<button class="icon-btn" data-action="drill-back" aria-label="Back">${ICON(ICONS.back)}</button>` : ""}<h2>${esc(title)}</h2></div>${closable ? `<button class="icon-btn" data-action="close-sheet" aria-label="Close">${ICON(ICONS.close)}</button>` : ""}</div>
      ${error}${body}
    </div>
  </div>` };
}

const CROSS_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;

function renderPdfReview() {

  const summary = plan ? `

      <button class="btn ghost" data-action="pdf-cancel">Cancel</button>

// Grouped by statement source. A name saves when the field loses focus;
// clearing it restores the default. Hidden accounts stay in every total.
function renderAccounts() {
  const list = Object.values(appData.accounts || {});
  if (!list.length) return `<p class="paste-help">No accounts yet. They're added as you import statements.</p>`;
  const bySource = {};
  list.forEach(a => { const s = DuitAccounts.sourceOf(a.id); (bySource[s] = bySource[s] || []).push(a); });
  const order = Object.keys(bySource).sort((a, b) => (a.startsWith("bank-") ? 0 : 1) - (b.startsWith("bank-") ? 0 : 1) || a.localeCompare(b));
  const groups = order.map(src => {
    const first = bySource[src][0];
    const rows = bySource[src].sort((a, b) => String(a.number || "").localeCompare(String(b.number || ""))).map(a => `
    <div class="acct-row${a.hidden ? " hidden-acct" : ""}">
      <input type="text" class="acct-name" data-id="${esc(a.id)}" value="${esc(a.name || DuitAccounts.defaultName(a))}" aria-label="Name for ${esc(DuitAccounts.defaultName(a))}" maxlength="40" autocomplete="off">
      <label class="acct-hide"><input type="checkbox" class="acct-hidden" data-id="${esc(a.id)}" ${a.hidden ? "checked" : ""}> Hide</label>
    </div>
    <p class="acct-meta">${a.number ? `${esc(first.bank)} ${a.kind === "card" ? "card" : "account"} ending ${esc(a.number)}` : "From imports before account numbers were read"}</p>`).join("");
    return `<div class="section-label">${esc(`${first.bank} ${first.kind === "card" ? "cards" : "accounts"}`)}</div>${rows}`;
  }).join("");
  return `
  <p class="paste-help">Accounts are added as you import statements, named by bank and the last 4 digits. Hiding one takes it out of the Statements list and its reminders. Its transactions still count.</p>
  ${groups}`;
}
function saveAccountEdit(id, patch) {
  const a = appData.accounts[id];
  if (!a) return;
  const next = { ...a, ...patch };
  if ("name" in patch && !String(patch.name).trim()) next.name = DuitAccounts.defaultName(a);
  if (next.name === a.name && !!next.hidden === !!a.hidden) return;
  persistAccounts([next]).then(render).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
}

function consumeSetupLink() {

async function readWithGemini(f) {
  f.geminiBusy = true; f.askConsent = false; f.geminiError = null;
  render();
  const res = await DuitGemini.parseWithGemini(f.pages, f.file, DuitGemini.loadKeys().gemini);
  const st = ui.pdfImport;
  const idx = st ? st.files.indexOf(f) : -1;
  if (idx === -1) return; // Import was cancelled meanwhile.
  if (res.error) { f.geminiBusy = false; f.geminiError = res.error; }
  else st.files[idx] = { ...res, include: res.checks.every(c => c.ok), open: false };
  render();
}

// Reads each picked PDF in turn (password prompts need to happen one at a
// time), then shows the review card. Nothing is saved until "Import".
async function startPdfImport(fileList) {
  const picked = Array.from(fileList);
  if (!picked.length) return;
  ui.syncError = null;
  ui.pdfImport = { busy: true, progress: "Loading the PDF reader…", files: [] };
  render();
  let lib;
  try { lib = await window.DuitPdfImport.loadPdfjs(); }
  catch (err) {
    ui.pdfImport = null;
    ui.syncError = navigator.onLine === false
      ? "PDF import needs a connection the first time it's used on this device. CSV import and paste work offline."
      : "Couldn't load the PDF reader: " + err.message;
    render(); return;
  }
  const results = [], seen = new Set();
  for (let i = 0; i < picked.length; i++) {
    const f = picked[i];
    if (seen.has(f.name)) { results.push({ file: f.name, error: "Picked twice. Only the first copy is used." }); continue; }
    seen.add(f.name);
    ui.pdfImport.progress = `Reading ${f.name} (${i + 1} of ${picked.length})…`;
    render();
    const data = new Uint8Array(await f.arrayBuffer());
    const ask = retry => window.prompt(retry ? `Wrong password for ${f.name}. Try again, or cancel to skip it:` : `${f.name} is password-protected. Enter its password, or cancel to skip it:`);
    results.push(await window.DuitPdfImport.parsePdf(lib, data, f.name, ask));
  }
  ui.pdfImport = { busy: false, files: results.map(r => ({ ...r, include: !r.error && r.checks.every(c => c.ok), open: false })) };
  render();
}

function periodMonths() {
  const months = appData.months;
  const from = Math.min(ui.fromIdx, months.length - 1);
  const to = Math.min(ui.toIdx, months.length - 1);
  return { from, to, filtered: months.slice(from, to + 1) };
}
const PRESETS = [["3m", "3M"], ["6m", "6M"], ["ytd", "YTD"], ["all", "All"]];
// Presets end at the latest full month, so a pending or partial month never
// drags them. With no full month yet, fall back to the latest one.
function presetRange(key) {
  const months = appData.months;
  let last = months.length - 1;
  while (last > 0 && !isConfirmed(months[last])) last--;
  if (!isConfirmed(months[last])) last = months.length - 1;
  if (key === "3m") return [Math.max(0, last - 2), last];
  if (key === "6m") return [Math.max(0, last - 5), last];
  if (key === "ytd") { const year = months[last].month.split(" ")[1]; return [months.findIndex(m => m.month.split(" ")[1] === year), last]; }
  return [0, last];
}
function renderPeriod(from, to, count) {
  const months = appData.months;
  const preset = ui.customPeriod ? null : (PRESETS.find(([k]) => { const [f, t] = presetRange(k); return f === from && t === to; }) || [null])[0];
  const options = sel => months.map((m, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(m.month)}</option>`).join("");
  return `
  <div class="chips" role="group" aria-label="Period">
    ${PRESETS.map(([k, label]) => `<button class="chip ${preset === k ? "on" : ""}" data-action="set-preset" data-preset="${k}" aria-pressed="${preset === k}">${label}</button>`).join("")}
    <button class="chip ${preset ? "" : "on"}" data-action="custom-period" aria-pressed="${!preset}">Custom</button>
  </div>
  ${preset ? "" : `<div class="period-bar">
    <select id="from-select" aria-label="From">${options(from)}</select>
    <span style="font-size:14px;color:var(--text-2)">to</span>
    <select id="to-select" aria-label="To">${options(to)}</select>
  </div>`}
  <div class="period-range">${esc(months[from].month)} – ${esc(months[to].month)} &middot; ${count} month${count !== 1 ? "s" : ""}</div>`;
}

// A month whose card statements are missing reads as a big drop in spend.
// Spot it from the card statement sources seen in the three months before
// it. Sources, not cards: a new card on the same statement isn't missing.
function cardAccounts(m) { return new Set((m.transactions || []).map(t => t.account).filter(isCardAccount).map(DuitAccounts.sourceOf)); }
function missingCards(m) {
  if (!m.cardSpendAvailable || !(m.transactions || []).length) return [];
  const i = appData.months.findIndex(x => x.month === m.month);
  const seen = new Set();
  appData.months.slice(Math.max(0, i - 3), Math.max(0, i)).forEach(p => cardAccounts(p).forEach(a => seen.add(a)));
  const have = cardAccounts(m);
  return [...seen].filter(a => !have.has(a));
}
// Months whose Op-Ex is complete: a card statement, and no card missing.
// Averages use only these; a partial month would pull them down.
function isConfirmed(m) { return m.cardSpendAvailable && !missingCards(m).length; }
function partialMonths(months) { return months.filter(m => m.cardSpendAvailable && missingCards(m).length).map(m => m.month); }
// Which statements are in, from saved records plus older imports inferred
// from their transactions (statements.js).
const statementCoverage = () => DuitStatements.coverage(Object.values(appData.statements || {}), appData.months, null, { hidden: src => DuitAccounts.sourceHidden(src, appData.accounts) });
const shortDate = ms => { const d = new Date(ms); return `${d.getUTCDate()} ${MONTH_ORDER[d.getUTCMonth()]}`; };
function renderStatementStrip() {
  const issues = DuitStatements.recentIssues(statementCoverage());
  if (!issues.length) return "";
  const shown = issues.slice(-4).reverse().map(x => `<strong>${esc(sourceLabel(x.account))}</strong> ${esc(x.month)} ${x.kind === "due" ? "due" : "missing"}`);
  const more = issues.length > 4 ? ` and ${issues.length - 4} more` : "";
  return `<div class="card nudge"><p>Statements to import: ${shown.join(" &middot; ")}${more}.</p><div class="btn-row" style="margin-top:0;"><button class="btn small" data-action="open-sheet" data-sheet="statements">View</button><button class="btn small primary" data-action="open-add">Import</button></div></div>`;
}
const CELL_LABEL = { ok: "Imported", inferred: "Imported before statements were tracked", warn: "Imported, but totals didn't match", gap: "Missing", due: "Overdue", none: "" };
function statementCell(cell) {
  const state = cell ? cell.state : "none", r = cell && cell.record;
  const title = [CELL_LABEL[state], r && r.file, r && `statement ${r.statementDate}`, r && `${r.rows} row${r.rows !== 1 ? "s" : ""}`].filter(Boolean).join(" · ");
  const mark = state === "ok" || state === "inferred" ? CHECK_ICON : state === "warn" ? WARN_ICON : state === "gap" ? CROSS_ICON : state === "due" ? "Due" : "·";
  return `<td class="stmt-cell ${state}" title="${esc(title)}">${mark}${title ? `<span class="sr-only">${esc(title)}</span>` : ""}</td>`;
}
function renderStatements() {
  const cov = statementCoverage();
  if (!cov.accounts.length) return `<div class="card"><p class="paste-help" style="margin:0;">No statements imported yet. Import a PDF and it shows up here.</p></div>`;
  const head = cov.accounts.map(a => `<th class="c">${esc(sourceLabel(a.name))}</th>`).join("");
  const body = cov.months.map(m => `<tr><th scope="row">${esc(m)}</th>${cov.accounts.map(a => statementCell(cov.cells[a.name][m])).join("")}</tr>`).join("");
  const summary = cov.accounts.map(a => `<div class="pdf-check ${a.overdue ? "bad" : "ok"}">${a.overdue ? CROSS_ICON : CHECK_ICON}<span><strong>${esc(sourceLabel(a.name))}</strong>: latest ${esc(a.last.statementDate)}${a.overdue ? ", next one overdue" : a.nextDue ? `, next around ${esc(shortDate(a.nextDue))}` : ""}</span></div>`).join("");
  return `
  <div class="card">
    <p class="paste-help">One row per statement, so a card statement covering several cards is one row. Each month is by statement date: a card cycle ending 12 Sep counts as Sep.</p>
    <div class="scroll-x ledger-wrap"><table class="ledger stmt-grid">
      <thead><tr><th>Month</th>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="stmt-legend">
      <span class="stmt-cell ok">${CHECK_ICON} imported</span>
      <span class="stmt-cell inferred">${CHECK_ICON} from older imports</span>
      <span class="stmt-cell warn">${WARN_ICON} totals didn't match</span>
      <span class="stmt-cell gap">${CROSS_ICON} missing</span>
      <span><span class="stmt-cell due">Due</span> overdue</span>
    </div>
    <div class="pdf-checks" style="margin:12px 0 0;">${summary}</div>
    <p class="paste-help" style="margin:12px 0 0;">Statements imported before this list existed are worked out from their transactions, dated by their latest one. Overdue means ${DuitStatements.GRACE_DAYS} days past the usual statement date.</p>
    <div class="btn-row"><button class="btn primary" data-action="open-add">Import statements</button></div>
  </div>`;
}

/* ============================== overview tab ============================== */
function bucketSources(m, bucket) {
  if (bucket === "opex") return m.cardSpendAvailable && m.categories ? [{ src: coreCategories(m), tag: null }] : [];
  const { savings, oneOffs } = splitOther(m);
  return [{ src: m.giroCategories, tag: "Fixed" }, { src: oneOffs, tag: "One-off" }, { src: savings, tag: "Savings" }, { src: flaggedCategories(m), tag: "Flagged" }];
}
// A month's other-out labels, split into savings and true one-offs by the current rules.
function splitOther(m) {
  const rules = currentRules(), savings = {}, oneOffs = {};
  Object.entries(m.otherCategories || {}).forEach(([k, v]) => { (rules.isSavings(k) ? savings : oneOffs)[k] = v; });
  return { savings, oneOffs };
}
const savingsAmount = m => Object.values(splitOther(m).savings).reduce((s, v) => s + v, 0);
function renderOverview(filtered) {
  const bucket = ui.bucketOverview;
  const available = filtered.filter(m => m.cardSpendAvailable);
  const confirmed = filtered.filter(isConfirmed);
  const partialCard = partialMonths(filtered);
  const totalIn = filtered.reduce((s, m) => s + m.totalIn, 0);
  const totalOpex = confirmed.reduce((s, m) => s + opexAmount(m), 0);
  const netTotalOpex = confirmed.reduce((s, m) => s + netOpexAmount(m), 0);
  const totalOut = filtered.reduce((s, m) => s + totalOutAdjusted(m), 0);
  const latest = filtered[filtered.length - 1];
  const prev = filtered.length > 1 ? filtered[filtered.length - 2] : null;
  const avgOpex = confirmed.length ? Math.round(totalOpex / confirmed.length) : null;
  const netAvgOpex = confirmed.length ? Math.round(netTotalOpex / confirmed.length) : null;
  // Net Op-Ex equals Core Op-Ex until something is reimbursed, so it only shows then.
  const hasReimb = confirmed.some(m => reimbursementAmount(m));
  // The month card shows the latest confirmed month: the newest month is
  // usually still waiting on a card statement, and a partial total misleads.
  const shown = confirmed.length ? confirmed[confirmed.length - 1] : latest;
  const shownPrev = confirmed.length > 1 ? confirmed[confirmed.length - 2] : null;
  const delta = isConfirmed(shown) && shownPrev ? pct(opexAmount(shown), opexAmount(shownPrev)) : null;
  const tone = delta > 15 ? "warn" : delta < -15 ? "ok" : "";
  const shownMissing = missingCards(shown);
  const later = filtered.slice(filtered.indexOf(shown) + 1).map(m => m.month.split(" ")[0]);
  // The hero's sub-line: the latest confirmed month, its change, what's still to come.
  const latestSub = [`${esc(shortMonth(shown.month))} ${shown.cardSpendAvailable ? esc(fmt(opexAmount(shown))) : "pending"}`,
    !shown.cardSpendAvailable ? "no card stmt yet"
    : shownMissing.length ? `partial: no ${esc(shownMissing.map(sourceLabel).join(", "))} yet`
    : delta != null ? `<span class="${tone}">${delta > 0 ? "+" : ""}${delta}% vs ${esc(shortMonth(shownPrev.month))}</span>` : null,
    later.length ? `${esc(later.join(", "))} pending` : null].filter(Boolean).join(" &middot; ");
  const partial = filtered.filter(m => !m.cardSpendAvailable).map(m => m.month);
  const inPeriod = new Set(filtered.map(m => m.month));
  const model = oneOffModel();
  const pendingSuggestions = [...model.suggestions.keys()].filter(k => inPeriod.has(k.split("|")[0])).length;
  // Savings rate: savings over salary for the period. Salary credits are
  // take-home pay; other credits (refunds, transfers in) would inflate it.
  const totalSavings = filtered.reduce((s, m) => s + savingsAmount(m), 0);
  const totalSalary = filtered.reduce((s, m) => s + (m.salaryIn || 0), 0);
  const savingsRate = totalSalary > 0 ? Math.round(totalSavings / totalSalary * 100) : null;

  // Op-Ex per-month figures divide by confirmed months only, so a partial
  // month (a card statement still missing) doesn't pull the averages down.
  const avgMonths = bucket === "opex" ? confirmed : filtered;
  const totals = {}; const tags = {}; const avgTotals = {};
  filtered.forEach(m => bucketSources(m, bucket).forEach(({ src, tag }) => {
    if (!src) return;
    Object.entries(src).forEach(([k, v]) => { if (k === "Credit Card Payment") return; if (v) { totals[k] = (totals[k] || 0) + v; if (tag) tags[k] = tag; } });
  }));
  avgMonths.forEach(m => bucketSources(m, bucket).forEach(({ src }) => {
    if (src) Object.entries(src).forEach(([k, v]) => { if (k !== "Credit Card Payment" && v) avgTotals[k] = (avgTotals[k] || 0) + v; });
  }));
  const cats = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const colorOf = colorMap(cats.map(([c]) => c));
  const bucketTotal = cats.reduce((s, [, v]) => s + v, 0);
  const maxCat = cats.reduce((m, [, v]) => Math.max(m, v), 0);
  const bucketMonths = avgMonths.length;
  const perMonth = v => bucketMonths ? v / bucketMonths : 0;
  const reimb = bucket === "opex" ? available.reduce((s, m) => s + reimbursementAmount(m), 0) : 0;
  const avgReimb = bucket === "opex" ? confirmed.reduce((s, m) => s + reimbursementAmount(m), 0) : 0;
  const netBucketTotal = bucketTotal - reimb;
  const avgBucketTotal = Object.values(avgTotals).reduce((s, v) => s + v, 0);
  const catValue = (m, cat) => bucketSources(m, bucket).reduce((s, { src }) => s + ((src || {})[cat] || 0), 0);
  const hasLatest = bucket === "opex" ? latest.cardSpendAvailable : true;
  const hasPrev = prev && (bucket === "opex" ? prev.cardSpendAvailable : true);

  const monthRows = filtered.map(m => {
    const entries = bucketEntries(m, bucket);
    const total = entries.reduce((s, [, v]) => s + v, 0);
    const isPartial = bucket === "opex" && !m.cardSpendAvailable;
    const missingCard = bucket === "opex" && partialCard.includes(m.month);
    return `<div class="month-row clickable" ${drillAttrs("drill-month", { month: m.month, bucket })}>
      <div class="month-head"><span class="month-label">${esc(m.month)}${missingCard ? '<span class="tag">partial</span>' : ""}</span><span class="month-total-wrap"><span class="month-total">${isPartial ? "—" : esc(fmt(total))}</span>${CHEV}</span></div>
      ${isPartial ? `<div class="stacked-bar empty"></div>` : stackedBar(entries, total, colorOf, cat => `data-action="drill-cat" data-bucket="${bucket}" data-month="${esc(m.month)}" data-cat="${esc(cat)}"`)}
    </div>`;
  }).join("");

  const catRows = cats.map(([cat, total]) => {
    const latestVal = hasLatest ? catValue(latest, cat) : null;
    const prevVal = hasPrev ? catValue(prev, cat) : null;
    const d = (latestVal != null && prevVal != null) ? latestVal - prevVal : null;
    const barPct = total > 0 && maxCat > 0 ? Math.min(100, total / maxCat * 100).toFixed(0) : "0";
    const deltaHtml = d != null && Math.abs(d) > 0.5
      ? `<span class="row2-delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${esc(fmt(Math.abs(d)))}</span>`
      : `<span class="row2-delta flat">—</span>`;
    return `<div class="row2 clickable" ${drillAttrs("drill-cat", { cat, bucket })}>
      <div class="row2-top">
        <span class="swatch" style="background:${colorOf(cat)}"></span>
        <span class="row2-name">${esc(cat)}${tags[cat] ? `<span class="tag">${esc(tags[cat])}</span>` : ""}</span>
        <span class="row2-amt">${esc(fmt(perMonth(avgTotals[cat] || 0)))}<small>/mo</small></span>${CHEV}
      </div>
      <div class="row2-bottom">
        <div class="row2-bar"><div class="row2-bar-fill" style="width:${barPct}%;background:${colorOf(cat)}"></div></div>
        <span class="row2-total">${esc(fmt(total))} tot</span>
        ${deltaHtml}
      </div>
    </div>`;
  }).join("");

  const reimbRow = (bucket === "opex" && reimb > 0) ? `
    <div class="row2">
      <div class="row2-top">
        <span class="swatch" style="background:var(--success)"></span>
        <span class="row2-name">Reimbursement<span class="tag">Offset</span></span>
        <span class="row2-amt" style="color:var(--success)">${esc(fmt(perMonth(-avgReimb)))}<small>/mo</small></span>
      </div>
      <div class="row2-bottom"><div class="row2-bar"></div><span class="row2-total">${esc(fmt(-reimb))} total</span></div>
    </div>
    <div class="row2" style="font-weight:600;">
      <div class="row2-top"><span class="row2-name" style="font-weight:600;">Net Op-Ex</span>
        <span class="row2-amt">${esc(fmt(perMonth(avgBucketTotal - avgReimb)))}<small>/mo</small></span></div>
      <div class="row2-bottom"><span class="row2-total">${esc(fmt(netBucketTotal))} total</span></div>
    </div>` : "";

  return `
  <div class="metrics">
    <div class="metric clickable" ${drillAttrs("drill-month", { month: shown.month, bucket: "opex" })}>
      <div class="metric-label">Core Op-Ex / mo${CHEV}</div>
      <div class="metric-value">${avgOpex != null ? esc(fmt(avgOpex)) : "—"}</div>
      <div class="metric-sub">${latestSub}</div>
      <div class="metric-sub">${confirmed.length} month${confirmed.length !== 1 ? "s" : ""} confirmed${partialCard.length ? ` &middot; ${esc(partialCard.map(mo => mo.split(" ")[0]).join(", "))} partial` : ""}${hasReimb && netAvgOpex != null ? ` &middot; net ${esc(fmt(netAvgOpex))} after reimbursements` : ""}</div>
    </div>
    <div class="metric clickable" role="button" tabindex="0" data-action="open-sheet" data-sheet="out"><div class="metric-label">Total out${CHEV}</div><div class="metric-value">${esc(fmt(totalOut))}</div><div class="metric-sub">${!ui.hideIncome ? `in ${esc(fmt(totalIn))}` : `${filtered.length} month${filtered.length !== 1 ? "s" : ""}`}${partial.length ? ` &middot; excl. ${esc(partial.join(", "))}` : ""}</div><div class="metric-sub">${esc(outSplit(outBreakdown(filtered), savingsRate))}</div>
      ${pendingSuggestions ? `<div class="metric-sub"><button class="link-btn" data-action="open-sheet" data-sheet="review">${pendingSuggestions} one-off${pendingSuggestions !== 1 ? "s" : ""} to review</button></div>` : ""}</div>
  </div>

    <p class="card-title">Monthly spend pattern</p>
    ${bucketToggle("bucketOverview", bucket)}

    ${monthRows}
  </div>

}
function bucketToggle(stateKey, current) {

/* ============================== drill-down sheets ==============================
   Tapping a month or a category opens a sheet over the page. Sheets stack two
   deep (a month, then a category in it). Each level is a history entry, so the
   phone's back button closes the top sheet instead of leaving the app. */
const DRILL_MAX = 2;
const BUCKET_LABEL = { opex: "Op-ex", other: "Other" };
const CHEV = `<span class="chev">${ICON(ICONS.chevron, 16)}</span>`;
const periodLabel = months => months.length > 1 ? `${months[0].month} – ${months[months.length - 1].month}` : months[0].month;
const shortMonth = month => month.split(" ")[0];
// $950, $1.2k, $12k: fits under a narrow bar.
const fmtShort = n => Math.abs(n) < 1000 ? fmt(n) : `${n < 0 ? "-" : ""}$${(Math.abs(n) / 1000).toFixed(Math.abs(n) < 10000 ? 1 : 0)}k`;
function drillAttrs(action, d) {
  return `role="button" tabindex="0" data-action="${action}" data-bucket="${d.bucket}"${d.month ? ` data-month="${esc(d.month)}"` : ""}${d.cat ? ` data-cat="${esc(d.cat)}"` : ""}`;
}
function openDrill(entry) {
  if (ui.drill.length >= DRILL_MAX) ui.drill[ui.drill.length - 1] = entry;
  else { ui.drill.push(entry); try { history.pushState({ drill: ui.drill.length }, ""); } catch (e) {} }
  ui.editTx = null;
  render();
}
// Trims the stack now; the history entries go too, and popstate then finds nothing to do.
function closeDrill(levels) {
  const n = Math.min(levels, ui.drill.length);
  if (!n) return;
  ui.drill = ui.drill.slice(0, ui.drill.length - n);
  ui.editTx = null;
  try { history.go(-n); } catch (e) {}
}
// A month's bucket as [label, amount, tag] rows, largest first. Card bill payments are never spend.
function bucketEntries(m, bucket) {
  const merged = {}, tags = {};
  bucketSources(m, bucket).forEach(({ src, tag }) => {
    if (src) Object.entries(src).forEach(([k, v]) => { if (k === "Credit Card Payment" || !v) return; merged[k] = (merged[k] || 0) + v; if (tag) tags[k] = tag; });
  });
  return Object.entries(merged).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v, tags[k] || null]);
}
// The saved rows behind one label in a bucket, routed the way buildMonths and
// the one-off model total them. Op-ex rows show cash, so flagged rows still appear.
function lineItems(months, bucket, label) {
  if (bucket === "opex") return opexLineItems(months, label);
  const inMonths = new Set(months.map(m => m.month));
  const group = Object.keys(FLAG_GROUPS).find(t => FLAG_GROUPS[t] === label);
  if (group) return oneOffModel().flagged.filter(r => r.type === group && inMonths.has(r.month)).map(r => ({ ...r.tx, amount: r.amount, month: r.month, key: r.key }));
  const rules = currentRules(), rows = [];
  months.forEach(m => (m.transactions || []).forEach((tx, i) => {
    const row = { description: tx.description, type: tx.withdrawal != null ? "DR" : "CR" };
    const isLabel = () => rules.isOneOff(label) && resolveCategory(tx) === label;
    let hit = false;
    if (isBankAccount(tx.account)) { const r = DuitRules.routeBankTx(row, rules); hit = r.kind === "fixed" ? r.name === label : r.kind === "spend" && isLabel(); }
    else if (isCardAccount(tx.account)) hit = DuitRules.routeCardTx(row, rules).kind === "spend" && isLabel();
    const amount = tx.withdrawal != null ? tx.withdrawal : -(tx.deposit || 0);
    if (hit && amount) rows.push({ ...tx, amount, month: m.month, guessed: !tx.category, key: txKey(m.month, i) });
  }));
  return rows;
}
// "▲ $120 (+8%) vs Aug", or null when there's nothing to compare with.
// More spend reads red; tone "save" turns that round, "neutral" leaves it uncoloured.
function deltaHtml(cur, prev, label, tone) {
  if (prev == null) return null;
  const d = cur - prev;
  if (Math.abs(d) < 0.5) return `Same as ${esc(label)}`;
  const p = pct(cur, prev);
  const cls = tone === "neutral" ? "" : (d > 0) === (tone === "save") ? "down" : "up";
  return `<span class="${cls}">${d > 0 ? "▲" : "▼"} ${esc(fmt(Math.abs(d)))}</span>${p != null ? ` (${d > 0 ? "+" : ""}${p}%)` : ""} vs ${esc(label)}`;
}
// Opens Transactions searched for the merchant, in the month when there is one.
const merchantRow = (name, amt, month) => `<div class="item-row clickable" role="button" tabindex="0" data-action="tx-search" data-q="${esc(name)}"${month ? ` data-month="${esc(month)}"` : ""}><span class="item-desc">${esc(name)}</span><span class="item-amt">${esc(fmt(amt))}</span>${CHEV}</div>`;
function itemRow(tx, dateText) {
  const c = spendControls(tx.key, tx);
  return `<div class="item-row"><span class="item-date">${esc(dateText)}</span><span class="item-desc" data-action="edit-spend" data-key="${esc(tx.key)}">${tx.guessed ? '<span class="guess">~ </span>' : ""}${esc(tx.description)}</span><span class="item-amt" style="color:${tx.amount < 0 ? "var(--success)" : "var(--text)"}">${tx.amount < 0 ? "−" : ""}${esc(fmt(Math.abs(tx.amount)))}</span></div>${c.tag ? `<div class="item-flags">${c.tag}</div>` : ""}${c.editor}`;
}

function renderMonthDrill(d) {
  const i = appData.months.findIndex(x => x.month === d.month), m = appData.months[i];
  if (!m) return `<p class="paste-help">That month is no longer in the ledger.</p>`;
  const prev = i > 0 ? appData.months[i - 1] : null;
  const counts = x => !(d.bucket === "opex" && !x.cardSpendAvailable);
  const entries = bucketEntries(m, d.bucket);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  const prevMap = prev && counts(prev) ? Object.fromEntries(bucketEntries(prev, d.bucket).map(([k, v]) => [k, v])) : null;
  const prevTotal = prevMap ? Object.values(prevMap).reduce((s, v) => s + v, 0) : null;
  const missing = d.bucket === "opex" ? missingCards(m) : [];
  const sub = !counts(m) ? "No card statement yet"
    : [deltaHtml(total, prevTotal, prev && shortMonth(prev.month), d.bucket === "other" ? "neutral" : "spend"), missing.length ? `partial: no ${esc(missing.map(sourceLabel).join(", "))} yet` : null].filter(Boolean).join(" &middot; ");
  // Savings can back out salary, so it hides with income, as the Savings / mo card does.
  const stats = [["Core op-ex", m.cardSpendAvailable ? fmt(opexAmount(m)) : "Pending"], ["Total out", fmt(totalOutAdjusted(m))]];
  if (!ui.hideIncome) stats.push(["Fixed bills", fmt(m.giroOut)], ["Savings", fmt(savingsAmount(m))], ["In", fmt(m.totalIn)], ["In less out", fmt(m.totalIn - totalOutAdjusted(m))]);
  const max = entries.reduce((s, [, v]) => Math.max(s, v), 0);
  const rows = entries.map(([cat, v, tag]) => {
    const dl = prevMap ? v - (prevMap[cat] || 0) : null;
    return `<div class="row2 clickable" ${drillAttrs("drill-cat", { cat, bucket: d.bucket, month: m.month })}>
      <div class="row2-top"><span class="row2-name">${esc(cat)}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</span><span class="row2-amt">${esc(fmt(v))}</span>${CHEV}</div>
      <div class="row2-bottom"><div class="row2-bar"><div class="row2-bar-fill" style="width:${max > 0 ? Math.max(0, v / max * 100).toFixed(0) : 0}%;background:var(--text-2)"></div></div>
      ${dl == null ? "" : Math.abs(dl) > 0.5 ? `<span class="row2-delta ${dl > 0 ? "up" : "down"}${tag === "Savings" ? " save" : ""}">${dl > 0 ? "▲" : "▼"} ${esc(fmt(Math.abs(dl)))}</span>` : `<span class="row2-delta flat">—</span>`}</div>
    </div>`;
  }).join("");
  const merchants = d.bucket === "opex" && m.cardSpendAvailable ? (m.topMerchants || []).slice(0, 5) : [];
  return `
  <div class="drill-head">
    <div class="drill-total">${counts(m) ? esc(fmt(total)) : "Pending"}</div>

  <div class="drill-section">By category${prevMap ? ` &middot; change vs ${esc(shortMonth(prev.month))}` : ""}</div>
  ${rows || `<p class="paste-help">Nothing in this view for ${esc(m.month)}.</p>`}
  ${merchants.length ? `<div class="drill-section">Top card merchants</div>

}

const DRILL_ITEM_LIMIT = 100;
function renderCatDrill(d) {
  const { filtered } = periodMonths();
  const counts = m => !(d.bucket === "opex" && !m.cardSpendAvailable);
  const valueIn = m => (bucketEntries(m, d.bucket).find(([k]) => k === d.cat) || [null, 0])[1];
  const scope = d.month ? appData.months.filter(m => m.month === d.month) : filtered;
  const total = scope.reduce((s, m) => s + (counts(m) ? valueIn(m) : 0), 0);
  // Op-ex averages divide by confirmed months only, as on the overview.
  const avgMonths = d.bucket === "opex" ? filtered.filter(isConfirmed) : filtered;
  const avg = avgMonths.length ? avgMonths.reduce((s, m) => s + valueIn(m), 0) / avgMonths.length : null;
  const sub = d.month ? (avg != null && avgMonths.length > 1 ? deltaHtml(total, avg, "period average", d.bucket === "other" && currentRules().isSavings(d.cat) ? "save" : "spend") : null)
    : [avg != null && avgMonths.length > 1 ? `${esc(fmt(avg))}/mo average` : null, `${filtered.length} month${filtered.length !== 1 ? "s" : ""}`].filter(Boolean).join(" &middot; ");

  const vals = filtered.map(m => ({ month: m.month, v: counts(m) ? valueIn(m) : null }));

    <p class="paste-help" style="margin:0 0 8px;">${d.month ? "Tap the month again to see the whole period." : "Tap a month to see only its rows."}</p>` : "";

  const items = lineItems(scope, d.bucket, d.cat);
  const byMerchant = {};
  items.forEach(tx => { const k = tx.description || "Unknown"; byMerchant[k] = (byMerchant[k] || 0) + tx.amount; });

  const shown = sorted.slice(0, DRILL_ITEM_LIMIT);

  else {
    const monthTotals = {};
    items.forEach(tx => { monthTotals[tx.month] = (monthTotals[tx.month] || 0) + tx.amount; });
    let cur = null;
    list = shown.map(tx => {
      const head = tx.month !== cur ? `<div class="drill-month"><span>${esc(tx.month)}</span><span>${esc(fmt(monthTotals[tx.month]))}</span></div>` : "";
      cur = tx.month;
      return head + itemRow(tx, dayMonth(tx));
    }).join("");
  }
  const sortBtn = (k, label) => `<button class="btn small ${ui.drillSort === k ? "on" : ""}" data-action="drill-sort" data-sort="${k}">${label}</button>`;
  return `
  <div class="drill-head">

    ${sub ? `<div class="drill-sub">${sub}</div>` : ""}

  ${merchants.length > 1 ? `<div class="drill-section">Top merchants</div>

  ${shown.some(tx => tx.guessed) ? `<p class="paste-help" style="margin:0 0 8px;">Rows marked ~ are categorised from the description, not a saved label.</p>` : ""}
  ${d.bucket === "opex" && shown.some(tx => tx.spendType) ? `<p class="paste-help" style="margin:0 0 8px;">Flagged rows show what was paid. Core op-ex leaves asset and exceptional rows out and spreads prepaid rows over their months, so the rows may not add up to the total.</p>` : ""}
  <div class="items drill-list">${list || `<p class="paste-help">No line items. Months entered by hand have totals only.</p>`}</div>
  ${items.length ? `<div class="btn-row drill-more"><button class="btn" data-action="drill-to-txns">See all in Transactions</button></div>` : ""}`;
}

// Fixed bills and savings can back out salary, so with income hidden they

function outSplit(b, savingsRate) {
  const parts = [["Spend", b.spend], ["One-offs", b.oneOffs + b.ruleOneOffs]];

  else parts.push(["Fixed", b.fixed], ["Saved", b.saved, savingsRate != null && b.saved ? ` (${savingsRate}%)` : ""]);

}
// From core op-ex to Total out, one step a row.
