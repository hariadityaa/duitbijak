<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duit Bijak — Finance Ledger</title>
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A local-only finance ledger. Nothing you enter leaves your browser.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-v3.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192-v3.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit Bijak">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Mono Dark design tokens — the single place colours, type, space and shape are defined. */
  :root{
    color-scheme:dark;
    --bg:#0a0a0a; --surface:#111111; --surface-2:#181818;
    --border:#262626; --border-strong:#3a3a3a;
    --text:#ededed; --text-2:#a1a1a1; --text-3:#6b6b6b;
    --accent:#ededed; --on-accent:#0a0a0a;
    --danger:#ef4444; --success:#22c55e; --focus:#ededed;
    /* chart ramp: the accent mixed into the card surface, brightest = largest */
    --chart-1:var(--accent);
    --chart-2:color-mix(in srgb, var(--accent) 80%, var(--surface));
    --chart-3:color-mix(in srgb, var(--accent) 64%, var(--surface));
    --chart-4:color-mix(in srgb, var(--accent) 52%, var(--surface));
    --chart-5:color-mix(in srgb, var(--accent) 42%, var(--surface));
    --chart-6:color-mix(in srgb, var(--accent) 34%, var(--surface));
    --chart-7:color-mix(in srgb, var(--accent) 28%, var(--surface));
    --chart-8:color-mix(in srgb, var(--accent) 23%, var(--surface));
    --chart-9:color-mix(in srgb, var(--accent) 19%, var(--surface));
    --chart-10:color-mix(in srgb, var(--accent) 16%, var(--surface));
    --font-sans:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --radius:8px; --radius-sm:6px; --radius-full:999px;
    --ease:150ms ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  body.sheet-open{ overflow:hidden; }
  body.sheet-open .fab{ display:none; }
  /* Aligned figures without monospace: Android has no ui-monospace, and its fallback spaces out commas */
  .num, .metric-value, .month-total, .row2-amt, .row2-total, .row2-delta, .item-date, .item-amt, .tx-amt, table.ledger{ font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-weight:600; line-height:1.25; text-wrap:balance; margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--on-accent); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  /* Bottom nav height, not counting the safe area below it */
  :root{ --nav-h:56px; --gutter:16px; }
  @media (min-width:640px){ :root{ --gutter:24px; } }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 var(--gutter) calc(var(--nav-h) + env(safe-area-inset-bottom) + 96px); }

  /* Slim sticky header: title, income privacy toggle, settings */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin:0 calc(-1 * var(--gutter)) 16px; padding:calc(env(safe-area-inset-top) + 8px) var(--gutter) 8px;
    background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .app-title{ font-size:18px; font-weight:600; letter-spacing:-0.01em; color:var(--text); }
  .topbar-btns{ display:flex; gap:4px; }
  .icon-btn{
    width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    border:none; border-radius:var(--radius); background:transparent; color:var(--text-2); cursor:pointer;
    transition:background-color var(--ease), color var(--ease);
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }

  /* Bottom nav holds read-only destinations. Adding data is the FAB, not a tab. */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center;
    background:var(--surface); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-inner{ display:flex; width:100%; max-width:560px; }
  .nav-btn{
    flex:1; min-height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border:none; background:transparent; color:var(--text-3); font-size:12px; font-weight:500; cursor:pointer;
    transition:color var(--ease);
  }
  .nav-btn.active{ color:var(--text); font-weight:600; }
  .fab{
    position:fixed; z-index:31; right:max(var(--gutter), calc((100vw - 1120px) / 2 + var(--gutter)));
    bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    width:56px; height:56px; border-radius:16px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:var(--on-accent); box-shadow:0 4px 16px rgba(0,0,0,.5);
    transition:transform 200ms ease, opacity 200ms ease;
  }
  .fab.hidden{ transform:translateY(24px); opacity:0; pointer-events:none; }

  /* Bottom sheet for actions: add data, PDF review, settings */
  .sheet-backdrop{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{
    width:100%; max-width:640px; max-height:90vh; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:16px 16px 0 0;
    padding:0 var(--gutter) calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.enter{ animation:sheet-in 200ms ease; }
  @keyframes sheet-in{ from{ transform:translateY(32px); opacity:0; } }
  .sheet-head{ position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 0; margin-bottom:8px; background:var(--surface); border-bottom:1px solid var(--border); }
  .sheet-head h2{ font-size:16px; }
  .sheet .card{ background:none; border:none; padding:0; margin:0 0 16px; }
  .sheet .card > .card-title:first-child{ display:none; }
  .action-row{
    display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:8px; cursor:pointer;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); color:var(--text);
    font-size:15px; font-weight:600; transition:border-color var(--ease);
  }
  .action-row:hover{ border-color:var(--border-strong); }
  .action-row span{ display:block; font-size:13px; font-weight:400; color:var(--text-2); margin-top:2px; }
  .settings-meta{ font-size:14px; color:var(--text-2); margin:0 0 16px; line-height:1.5; }

  /* Period presets */
  .chips{ display:flex; gap:8px; align-items:center; overflow-x:auto; scrollbar-width:none; margin-bottom:8px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    height:32px; padding:0 14px; flex-shrink:0; border-radius:var(--radius-full); border:1px solid var(--border);
    background:transparent; color:var(--text-2); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .chip.on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .period-range{ font-size:13px; color:var(--text-2); margin-bottom:16px; }

  .card.nudge{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-color:var(--border-strong); background:var(--surface-2); }
  .card.nudge p{ margin:0; font-size:14px; color:var(--text-2); line-height:1.5; flex:1 1 200px; }
  .card.nudge strong{ color:var(--text); }

  /* Transactions tab */
  .tx-search{ width:100%; margin-bottom:8px; }
  .tx-summary{ font-size:13px; color:var(--text-2); margin-bottom:8px; }
  .tx-day{ font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; padding:16px 0 4px; border-bottom:1px solid var(--border); }
  .tx-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .tx-main{ flex:1; min-width:0; }
  .tx-desc{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-meta{ font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-amt{ font-size:14px; font-weight:500; white-space:nowrap; flex-shrink:0; }
  .tx-amt.in{ color:var(--success); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; line-height:1;
    height:40px; padding:0 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); cursor:pointer; white-space:nowrap;
    transition:background-color var(--ease), border-color var(--ease), color var(--ease), opacity var(--ease);
  }
  .btn:hover:not(:disabled){ background:var(--border); border-color:var(--border-strong); }
  .btn.primary, .btn.on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled), .btn.on:hover:not(:disabled){ background:var(--accent); border-color:var(--accent); opacity:.88; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-2); }
  .btn.ghost:hover:not(:disabled){ background:var(--surface-2); border-color:transparent; color:var(--text); }
  .btn.danger{ color:var(--danger); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.small{ padding:0 12px; min-width:40px; }

  .banner{
    display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius);
    font-size:14px; line-height:1.5; margin-bottom:16px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-2);
  }
  .banner svg{ flex-shrink:0; margin-top:2px; }
  .banner.error svg{ color:var(--danger); }
  .banner strong{ color:var(--text); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  @media (min-width:640px){ .card{ padding:24px; } }
  .card-title{
    font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em;
    margin:0 0 16px; padding-bottom:12px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .section-label{ font-size:12px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; margin:24px 0 12px; }

  .metrics{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-bottom:24px; }
  @media (min-width:900px){ .metrics{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .metric{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .metric.ok .metric-sub{ color:var(--success); }
  .metric.warn .metric-sub{ color:var(--danger); }
  .metric-label{ font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-bottom:4px; }
  .metric-value{ font-size:22px; font-weight:600; letter-spacing:-.02em; line-height:1.25; }
  .metric-sub{ font-size:12px; color:var(--text-2); margin-top:4px; }

  .toggle-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .toggle-row .total{ font-size:14px; color:var(--text-2); margin-left:4px; }
  .toggle-row .total strong{ color:var(--text); }

  .legend{ display:flex; flex-wrap:wrap; gap:12px 16px; margin-bottom:12px; font-size:12px; color:var(--text-2); }
  .legend span.sw{ width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:8px; flex-shrink:0; border:1px solid var(--border-strong); }
  .legend-item{ display:flex; align-items:center; }

  .swatch{ width:12px; height:12px; border-radius:4px; flex-shrink:0; border:1px solid var(--border-strong); }

  .month-row{ padding:12px 0; border-bottom:1px solid var(--border); }
  .month-row:last-child{ border-bottom:none; }
  .month-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px; }
  .month-label{ font-size:14px; font-weight:600; }
  .month-total{ font-size:14px; color:var(--text-2); }
  .stacked-bar{ display:flex; height:16px; border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-2); }
  .stacked-bar .seg{ height:100%; min-width:2px; }
  .stacked-bar.empty{ background:var(--surface-2); }

  .row2{ padding:12px 0; border-bottom:1px solid var(--border); }
  .row2:last-child{ border-bottom:none; }
  .row2-top{ display:flex; align-items:center; gap:12px; }
  .row2-name{ flex:1; min-width:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row2-amt{ font-size:16px; font-weight:600; white-space:nowrap; flex-shrink:0; }
  .row2-amt small{ font-size:12px; font-weight:400; color:var(--text-2); }
  .row2-bottom{ display:flex; align-items:center; gap:12px; margin-top:8px; }
  .row2-bar{ flex:1; height:8px; background:var(--surface-2); border-radius:var(--radius-sm); overflow:hidden; min-width:24px; }
  .row2-bar-fill{ height:100%; border-radius:var(--radius-sm); }
  .row2-total{ font-size:12px; color:var(--text-2); white-space:nowrap; flex-shrink:0; }
  .row2-delta{ font-size:12px; font-weight:500; white-space:nowrap; flex-shrink:0; }
  .row2-delta.up{ color:var(--danger); } .row2-delta.down{ color:var(--success); } .row2-delta.flat{ color:var(--text-2); }
  .tag{ font-size:12px; margin-left:8px; padding:0 8px; border-radius:var(--radius-full); border:1px solid var(--border-strong); color:var(--text-2); font-weight:500; }
  .clickable{ cursor:pointer; margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:var(--radius-sm); transition:background-color var(--ease); }
  .clickable:hover{ background:var(--surface-2); }
  .clickable.selected{ background:var(--surface-2); }

  .trend-cell{ display:flex; align-items:flex-end; gap:4px; height:24px; min-width:60px; }
  .trend-cell .bar{ width:6px; border-radius:2px 2px 0 0; min-height:2px; flex-shrink:0; }

  .items{ padding:0; }
  .item-row{ display:flex; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .item-row:last-child{ border-bottom:none; }
  .item-date{ color:var(--text-2); font-size:12px; white-space:nowrap; }
  .item-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-amt{ font-weight:500; white-space:nowrap; }
  .guess{ color:var(--text-2); }

  .period-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .period-bar label{ font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  select, input[type=text], input[type=search], input[type=number], input[type=password], textarea{
    font-family:inherit; font-size:14px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius); padding:0 12px; height:40px;
    transition:border-color var(--ease);
  }
  textarea{ height:auto; padding:12px; }
  select:hover, input:hover, textarea:hover{ border-color:var(--border-strong); }
  input::placeholder, textarea::placeholder{ color:var(--text-3); }

  .empty-state{ text-align:center; padding:48px 16px; }
  .empty-state h2{ font-size:20px; margin-bottom:8px; }
  .empty-state p{ color:var(--text-2); font-size:16px; max-width:440px; margin:0 auto 24px; line-height:1.5; }

  textarea.paste-area{ width:100%; min-height:160px; resize:vertical; font-family:var(--font-mono); font-size:12px; }
  .paste-help{ font-size:14px; color:var(--text-2); line-height:1.5; margin:0 0 12px; }
  .btn-row{ display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }

  .pdf-file{ padding:12px 0; border-top:1px solid var(--border); }
  .pdf-head{ display:flex; align-items:center; gap:8px; font-size:14px; min-height:40px; cursor:pointer; overflow-wrap:anywhere; }
  .pdf-head input{ width:16px; height:16px; flex-shrink:0; accent-color:var(--accent); }
  .pdf-meta{ font-size:12px; color:var(--text-2); margin:0 0 8px 24px; }
  .pdf-meta strong{ color:var(--danger); font-weight:500; }
  .pdf-checks{ display:flex; flex-direction:column; gap:4px; margin-left:24px; }
  .pdf-check{ display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--text-2); }
  .pdf-check svg{ flex-shrink:0; margin-top:1px; }
  .pdf-check.ok svg{ color:var(--success); }
  .pdf-check.bad svg, .pdf-check.bad{ color:var(--danger); }
  .pdf-file .btn.small{ margin-left:16px; }
  .pdf-tag{ display:inline-block; font-size:11px; padding:1px 6px; border:1px solid var(--border); border-radius:4px; color:var(--text-2); margin-left:4px; }
  .pdf-consent{ font-size:12px; color:var(--text-2); margin:8px 0 0 24px; max-width:60ch; }
  .key-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .key-row input{ flex:1 1 220px; min-width:0; }
  table.ledger td.pdf-desc{ max-width:200px; overflow:hidden; text-overflow:ellipsis; }

  .form-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:560px){ .form-grid.cols2{ grid-template-columns:1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:14px; color:var(--text-2); }
  .field input{ width:100%; }

  table.ledger{ width:100%; border-collapse:collapse; font-size:12px; }
  table.ledger th{ text-align:left; padding:8px 12px; color:var(--text-2); font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:12px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface-2); }
  table.ledger td{ padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.ledger th.r, table.ledger td.r{ text-align:right; }
  .scroll-x{ overflow-x:auto; }
  .ledger-wrap{ max-height:420px; overflow-y:auto; border-radius:var(--radius); }
  .month-toggle{ width:100%; text-align:left; min-height:40px; padding:8px 12px; font-size:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--text); margin-bottom:8px; font-family:var(--font-mono); transition:background-color var(--ease); }
  .month-toggle:hover{ background:var(--border); }
  .month-toggle .r{ color:var(--text-2); }

  /* One-off prompts (install, update) stand apart from the dashboard cards */
  .card.promo{ border-color:var(--border-strong); background:var(--surface-2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .card.promo p{ margin:0; font-size:14px; color:var(--text-2); line-height:1.5; }
  .card.promo strong{ color:var(--text); }
  .card.promo .btn-row{ margin-top:0; }

  .toast{ position:fixed; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 88px); left:50%; transform:translateX(-50%); background:var(--accent); color:var(--on-accent); padding:12px 16px; border-radius:var(--radius); font-size:14px; font-weight:500; z-index:50; }

  .settings-meta a{ color:var(--text); text-decoration:underline; text-underline-offset:2px; }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="toast-holder"></div>

<script src="pdf-import.js"></script>
<script src="gemini-parse.js"></script>
<script src="categorise.js"></script>
<script>
(function(){
"use strict";

/* ============================== constants ============================== */
const STORAGE_KEY = "duit-bijak-finance-ledger-v1";
const MONTH_ORDER = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const CATEGORY_FIELDS = [
  ["cat_shopping","Shopping/Online"], ["cat_dining","Dining & Food"], ["cat_transport","Transport"],
  ["cat_sports","Sports"], ["cat_home","Home & Furniture"], ["cat_groceries","Groceries"],
  ["cat_services","Services"], ["cat_electronics","Electronics"], ["cat_subscriptions","Subscriptions"],
  ["cat_travel","Travel"], ["cat_fashion","Fashion"], ["cat_utilities","Utilities"], ["cat_convenience","Convenience Stores"],
  ["cat_other","Other"],
];

// No defaults here on purpose — this is a public template. Each visitor's
// fixed commitments are entered by hand (Deep Dive tab) and kept only in
// their own browser; nobody else's numbers ship with the page.
const DEFAULT_GIRO = { "HDB Loan": 0, "TMLS (Insurance/Tax)": 0, "iFAST Investment": 0, "IRAS Income Tax": 0 };

const GIRO_KEYWORDS = [
  { key: "HDB Loan", match: /HDB Housing Loan/i },
  { key: "TMLS (Insurance/Tax)", match: /\bTMLS\b/i },
  { key: "iFAST Investment", match: /iFAST FINANCIAL/i },
  { key: "IRAS Income Tax", match: /IRAS Income Tax/i },
];
// Statement types. "Other …" are statements read by Gemini (gemini-parse.js).
const BANK_TYPES = new Set(["UOB One", "POSB", "Other account"]);
const CARD_TYPES = new Set(["DBS CC", "UOB Card", "Other card"]);
const SALARY_MATCH = /Salary Payment/i;
const INTERBANK_TRANSFER_MATCH = /Funds Tr(a|f)nsfer|Funds Trf/i;
const CARD_BILL_PAYMENT_MATCH = /Bill Payment.*(Cards?|DBSC)|mBK-UOB Cards|BILL PAYMENT - DBS INTERNET/i;
const OTHER_CATEGORY_WHITELIST = new Set([
  "iFAST Investment", "Renovation", "Internal Transfer",
  "IRAS Income Tax", "TMLS (Insurance/Tax)", "HDB Loan", "Family Support", "Reimbursement",
]);

// Category rules and history matching live in categorise.js.

/* ============================== utilities ============================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => { if (n == null || isNaN(n)) return "—"; const r = Math.round(n); return r < 0 ? `-$${Math.abs(r).toLocaleString()}` : `$${r.toLocaleString()}`; };
const pct = (a, b) => b ? ((a - b) / b * 100).toFixed(0) : null;
function hashColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return `var(--chart-${(Math.abs(h) % 10) + 1})`;
}
// Assigns colors by rank (order of `names`) instead of a hash, so the handful of
// categories in any one view get visually distinct colors instead of colliding.
function colorMap(names) {
  const map = {};
  names.forEach((n, i) => { if (!(n in map)) map[n] = `var(--chart-${(i % 10) + 1})`; });
  return name => map[name] || hashColor(name);
}

/* ============================== CSV / TSV parsing ============================== */
function parseCsv(text, delimiter) {
  delimiter = delimiter || ",";
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delimiter) { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some(f => f !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function detectDelimiter(text) {
  const firstLine = text.split(/\r?\n/).find(l => l.trim() !== "") || "";
  const tabs = (firstLine.match(/\t/g) || []).length;
  const commas = (firstLine.match(/,/g) || []).length;
  return tabs > commas ? "\t" : ",";
}
function parseSheetTransactions(csvText) {
  const rows = parseCsv(csvText, detectDelimiter(csvText));
  const headerIdx = rows.findIndex(r => (r[0] || "").trim() === "Statement File");
  if (headerIdx === -1) throw new Error('No "Statement File" header found. Paste the full table, starting with its header row.');
  const out = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const file = (r[0] || "").trim();
    if (!file || file === "File ID") break;
    const bank = (r[1] || "").trim();
    const date = (r[2] || "").trim();
    const description = (r[3] || "").trim();
    const amount = parseFloat((r[4] || "0").replace(/,/g, ""));
    const type = (r[5] || "").trim().toUpperCase();
    const category = (r[6] || "").trim();
    if (!date || !bank) continue;
    out.push({ file, bank, date, description, amount: isNaN(amount) ? 0 : amount, type, category });
  }
  if (!out.length) throw new Error("No transaction rows found under the header.");
  return out;
}
function classifyFile(rows) {
  const text = rows.map(r => r.description).join(" | ");
  if (/One Account|HDB Housing Loan|IRAS Income Tax|iFAST FINANCIAL|GIRO SALA|Salary Payment/i.test(text)) return "UOB One";
  const bank = rows[0] && rows[0].bank;
  if (bank === "POSB") return "POSB";
  if (bank === "DBS") return "DBS CC";
  if (bank === "UOB") return "UOB Card";
  return "Unknown";
}
// Rebuilt whenever appData.months is replaced, so a new import or sync
// teaches the next guess. Only saved (hand-set or imported) labels count.
let categoryHistoryFor = null, categoryHistory = new Map();
function currentCategoryHistory() {
  if (categoryHistoryFor !== appData.months) {
    categoryHistoryFor = appData.months;
    categoryHistory = DuitCategorise.buildCategoryHistory(appData.months.flatMap(m => m.transactions || []));
  }
  return categoryHistory;
}
const classifyOpex = description => DuitCategorise.classifyOpex(description, currentCategoryHistory());
const resolveCategory = tx => DuitCategorise.resolveCategory(tx.description, tx.category, currentCategoryHistory());
function monthKeyFromDate(dateStr) {
  const parts = dateStr.trim().split(" ");
  if (parts.length < 3) return null;
  return `${parts[1]} ${parts[2]}`;
}

/* ============================== aggregation ============================== */
function buildMonths(cleanRows) {
  const byMonth = {};
  cleanRows.forEach(tx => {
    const month = monthKeyFromDate(tx.date);
    if (!month) return;
    (byMonth[month] = byMonth[month] || []).push(tx);
  });
  const months = {};
  Object.entries(byMonth).forEach(([month, txs]) => {
    const bankTxs = txs.filter(t => BANK_TYPES.has(t.stmtType));
    const cardTxs = txs.filter(t => CARD_TYPES.has(t.stmtType));
    let salaryIn = 0, otherIn = 0, giroOut = 0, otherOut = 0, cardSpend = 0;
    const giroCategories = { "HDB Loan": 0, "TMLS (Insurance/Tax)": 0, "iFAST Investment": 0, "IRAS Income Tax": 0 };
    const otherCategories = {};
    const categories = {};
    const merchantTotals = {};

    bankTxs.forEach(tx => {
      if (INTERBANK_TRANSFER_MATCH.test(tx.description)) return;
      if (tx.type === "DR" && CARD_BILL_PAYMENT_MATCH.test(tx.description)) return;
      const giro = tx.type === "DR" ? GIRO_KEYWORDS.find(g => g.match.test(tx.description)) : null;
      if (giro) { giroOut += tx.amount; giroCategories[giro.key] += tx.amount; return; }
      if (tx.type === "CR") { if (SALARY_MATCH.test(tx.description)) salaryIn += tx.amount; else otherIn += tx.amount; return; }
      const label = resolveCategory(tx);
      if (label === "Credit Card Payment") return;
      if (OTHER_CATEGORY_WHITELIST.has(label)) { otherOut += tx.amount; otherCategories[label] = round2((otherCategories[label] || 0) + tx.amount); }
      else { cardSpend += tx.amount; categories[label] = round2((categories[label] || 0) + tx.amount); }
    });

    cardTxs.forEach(tx => {
      if (CARD_BILL_PAYMENT_MATCH.test(tx.description)) return;
      const signed = tx.type === "DR" ? tx.amount : -tx.amount;
      const cat = resolveCategory(tx);
      if (cat === "Credit Card Payment") return;
      if (OTHER_CATEGORY_WHITELIST.has(cat)) { otherOut += signed; otherCategories[cat] = round2((otherCategories[cat] || 0) + signed); }
      else {
        cardSpend += signed; categories[cat] = round2((categories[cat] || 0) + signed);
        const merchant = tx.description || "Unknown";
        merchantTotals[merchant] = round2((merchantTotals[merchant] || 0) + signed);
      }
    });

    const topMerchants = Object.entries(merchantTotals).filter(([, a]) => a > 0).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([name, amt]) => ({ name, amt }));
    const allTx = txs.map(t => ({ date: t.date, account: t.stmtType, description: t.description, withdrawal: t.type === "DR" ? t.amount : null, deposit: t.type === "CR" ? t.amount : null, category: t.category || null, file: t.file || null }))
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    months[month] = {
      month, salaryIn: round2(salaryIn), otherIn: round2(otherIn), totalIn: round2(salaryIn + otherIn),
      cardSpend: round2(cardSpend), cardSpendAvailable: cardTxs.length > 0,
      giroOut: round2(giroOut), otherOut: round2(otherOut), totalOut: round2(cardSpend + giroOut + otherOut),
      giroCategories, categories: cardTxs.length > 0 ? categories : null, otherCategories, topMerchants, transactions: allTx,
    };
  });
  return months;
}
function sortMonthKeys(keys) {
  return keys.sort((a, b) => {
    const [am, ay] = a.split(" "), [bm, by] = b.split(" ");
    return ay !== by ? Number(ay) - Number(by) : MONTH_ORDER.indexOf(am) - MONTH_ORDER.indexOf(bm);
  });
}
function syncFromText(csvText) {
  return syncFromRows(parseSheetTransactions(csvText));
}
// Rows from the PDF parsers already know their statement type. Only rows
// without one (CSV and paste) fall back to guessing it from descriptions.
function syncFromRows(rawRows) {
  const byFile = {};
  rawRows.forEach(r => { if (!r.stmtType) (byFile[r.file] = byFile[r.file] || []).push(r); });
  const fileType = {};
  Object.entries(byFile).forEach(([file, rows]) => { fileType[file] = classifyFile(rows); });
  const clean = rawRows.map(r => ({ ...r, stmtType: r.stmtType || fileType[r.file] }));
  const monthTotals = buildMonths(clean);
  const monthKeys = sortMonthKeys(Object.keys(monthTotals));
  return monthKeys.map(k => monthTotals[k]);
}

// PDFs arrive a statement at a time, and a card statement spans two months,
// so a PDF import can't replace whole months the way a full CSV does. Instead
// each touched month is rebuilt from its saved transactions plus the new rows:
// rows from a re-uploaded file replace that file's earlier rows, and rows saved
// before transactions carried their file are matched one for one (so three
// identical purchases stay three) on date, type, amount and description, then
// on date, type, amount and account. Description goes first because older CSV
// imports could mislabel the account (POSB saved as "UOB One"); digits are
// ignored because older imports stripped merchant numbers. Any matched row
// passes its category on, so hand-set categories survive a re-import.
function txToRow(tx) {
  const isDr = tx.withdrawal != null;
  return { file: tx.file || "", date: tx.date, description: tx.description, amount: isDr ? tx.withdrawal : (tx.deposit || 0), type: isDr ? "DR" : "CR", category: tx.category || "", stmtType: tx.account };
}
const descKey = d => String(d || "").toUpperCase().replace(/[\d\s]+/g, "");
const sameAmount = (a, b) => a.date === b.date && a.type === b.type && Math.abs(a.amount - b.amount) < 0.005;
function matchOldRows(incoming, pool) {
  const tiers = [(o, r) => descKey(o.description) === descKey(r.description), (o, r) => o.stmtType === r.stmtType];
  tiers.forEach(same => incoming.forEach(r => {
    if (r.matched) return;
    const old = pool.find(o => !o.matched && sameAmount(o, r) && same(o, r));
    if (!old) return;
    old.matched = r.matched = true;
    if (!r.category && old.category) r.category = old.category;
  }));
}
function planImport(newRows) {
  const files = new Set(newRows.map(r => r.file));
  const existing = {}; appData.months.forEach(m => { existing[m.month] = m; });
  const byMonth = {};
  newRows.forEach(r => { const k = monthKeyFromDate(r.date); if (k) (byMonth[k] = byMonth[k] || []).push({ ...r }); });
  const rows = [], manual = [];
  let replaced = 0;
  Object.entries(byMonth).forEach(([month, incoming]) => {
    const prev = existing[month];
    if (prev && !(prev.transactions || []).length) manual.push(month);
    const saved = prev ? (prev.transactions || []).map(txToRow) : [];
    const sameFile = saved.filter(r => r.file && files.has(r.file));
    const legacy = saved.filter(r => !r.file);
    matchOldRows(incoming, sameFile.concat(legacy));
    const keptLegacy = legacy.filter(r => !r.matched);
    replaced += sameFile.length + legacy.length - keptLegacy.length;
    rows.push(...saved.filter(r => r.file && !files.has(r.file)), ...keptLegacy, ...incoming.map(({ matched, ...r }) => r));
  });
  return { months: syncFromRows(rows), monthKeys: sortMonthKeys(Object.keys(byMonth)), manual, replaced };
}
function opexLineItems(months, category) {
  const rows = [];
  months.forEach(m => {
    if (!m.cardSpendAvailable) return;
    (m.transactions || []).forEach(tx => {
      if (INTERBANK_TRANSFER_MATCH.test(tx.description)) return;
      if (CARD_BILL_PAYMENT_MATCH.test(tx.description)) return;
      if (GIRO_KEYWORDS.some(g => g.match.test(tx.description))) return;
      const isBank = BANK_TYPES.has(tx.account);
      if (isBank && tx.withdrawal == null) return;
      const amount = tx.withdrawal != null ? tx.withdrawal : -(tx.deposit || 0);
      if (!amount) return;
      const resolvedCat = resolveCategory(tx);
      if (resolvedCat !== category) return;
      rows.push({ ...tx, amount, month: m.month, guessed: !tx.category });
    });
  });
  return rows.sort((a, b) => b.amount - a.amount);
}
function ccpAdjustment(m) { const v = m.cardSpendAvailable && m.categories ? m.categories["Credit Card Payment"] : 0; return v ? -v : 0; }
function opexAmount(m) { return m.cardSpendAvailable ? round2((m.cardSpend || 0) + ccpAdjustment(m)) : null; }
function totalOutAdjusted(m) { return round2((m.totalOut || 0) + ccpAdjustment(m)); }
function reimbursementAmount(m) { return (m.otherCategories && m.otherCategories["Reimbursement"]) || 0; }
function netOpexAmount(m) { const g = opexAmount(m); return g != null ? round2(g - reimbursementAmount(m)) : null; }

/* ============================== persistence ==============================
   Two layers: the `db` capability (a shared, realtime store scoped to this
   artifact) when the viewer grants it — this only applies if the page is
   ever embedded inside a Claude artifact viewer. Falls back to this
   browser's localStorage otherwise, which is the normal path when this
   page is hosted as a plain static site (e.g. GitHub Pages): there is no
   server and no account system here, so every visitor's data lives only
   in their own browser and is never sent anywhere. One document per month
   (or per fixed commitment), keyed by a sanitized id, when db is active. */
let dbApi = null;
const docIdForMonth = month => month.replace(/\s+/g, "_");
const docIdForCommitment = name => name.replace(/[^\w-]+/g, "_") || "item";
// Months saved before a category rename still carry the old labels in their
// totals. Fold them into the current ones as they load.
const canonMonth = m => (m && m.categories ? { ...m, categories: DuitCategorise.canonCategoryTotals(m.categories) } : m);
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const parsed = JSON.parse(raw); return { months: (parsed.months || []).map(canonMonth), fixedCommitments: parsed.fixedCommitments || {} }; }
  } catch (e) {}
  return { months: [], fixedCommitments: {} };
}
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (e) {} }

let appData = { months: [], fixedCommitments: {} };
let ui = {
  tab: "overview", fromIdx: 0, toIdx: 0, hideIncome: true,
  bucketOverview: "opex", bucketDeep: "opex", selectedCat: null,
  sheet: null, // null | "add" | "paste" | "month" | "settings"
  customPeriod: false, txQuery: "", txLimit: 0, syncError: null, lastSynced: null,
  storage: "connecting", // "connecting" | "synced" | "local"
};
function resetPeriod() {
  const n = appData.months.length;
  ui.toIdx = Math.max(0, n - 1);
  ui.fromIdx = Math.max(0, n - 3);
}
function applySnapshotMonths(rawMonths) {
  const byKey = {}; rawMonths.forEach(m => { byKey[m.month] = canonMonth(m); });
  appData.months = sortMonthKeys(Object.keys(byKey)).map(k => byKey[k]);
  resetPeriod();
  ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
  render();
}
function applySnapshotFixed(rawFixed) {
  const map = {};
  rawFixed.forEach(f => { map[f.name] = f.amount; });
  appData.fixedCommitments = map;
  render();
}
async function initPersistence() {
  const canUseDb = typeof window.claude === "object" && window.claude && typeof window.claude.use === "function";
  const db = canUseDb ? await window.claude.use("db").catch(() => null) : null;
  if (db) {
    dbApi = db;
    ui.storage = "synced";
    db.collection("months").onSnapshot(
      snap => applySnapshotMonths(snap.docs.filter(d => d.exists).map(d => d.data())),
      err => { ui.storage = "local"; dbApi = null; appData = loadLocal(); resetPeriod(); ui.syncError = "Cross-device sync unavailable (" + err.message + ") — using this browser only."; render(); }
    );
    db.collection("fixedCommitments").onSnapshot(
      snap => applySnapshotFixed(snap.docs.filter(d => d.exists).map(d => d.data())),
      () => {}
    );
  } else {
    ui.storage = "local";
    appData = loadLocal();
    resetPeriod();
    render();
  }
}
// Writes months (an array of month objects) to whichever layer is active.
// With db, each month is its own document — a paste only overwrites the
// months it covers, so previously synced/manual months are left alone.
async function persistMonths(monthsArr) {
  if (dbApi) {
    await Promise.all(monthsArr.map(m => dbApi.collection("months").doc(docIdForMonth(m.month)).set(m)));
  } else {
    const byKey = {}; appData.months.forEach(m => { byKey[m.month] = m; });
    monthsArr.forEach(m => { byKey[m.month] = m; });
    appData.months = sortMonthKeys(Object.keys(byKey)).map(k => byKey[k]);
    saveLocal();
    resetPeriod();
  }
}
async function persistFixedCommitment(name, amount) {
  if (dbApi) {
    await dbApi.collection("fixedCommitments").doc(docIdForCommitment(name)).set({ name, amount });
  } else {
    appData.fixedCommitments[name] = amount;
    saveLocal();
  }
}
async function deleteFixedCommitment(name) {
  if (dbApi) {
    await dbApi.collection("fixedCommitments").doc(docIdForCommitment(name)).delete();
  } else {
    delete appData.fixedCommitments[name];
    saveLocal();
  }
}
async function clearAllData() {
  if (dbApi) {
    const snap = await dbApi.collection("months").get();
    await Promise.all(snap.docs.map(d => dbApi.collection("months").doc(d.id).delete()));
    const fsnap = await dbApi.collection("fixedCommitments").get();
    await Promise.all(fsnap.docs.map(d => dbApi.collection("fixedCommitments").doc(d.id).delete()));
  } else {
    appData = { months: [], fixedCommitments: {} };
    saveLocal();
  }
}

function showToast(msg) {
  const holder = document.getElementById("toast-holder");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  holder.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ============================== chart bits ============================== */
function stackedBar(entries, total, colorOf) {
  colorOf = colorOf || hashColor;
  if (!entries.length || total <= 0) return `<div class="stacked-bar empty"></div>`;
  const segs = entries.map(([name, val]) => {
    if (val <= 0) return "";
    const w = (val / total * 100).toFixed(2);
    return `<div class="seg" style="width:${w}%;background:${colorOf(name)}" title="${esc(name)}: ${esc(fmt(val))}"></div>`;
  }).join("");
  return `<div class="stacked-bar">${segs}</div>`;
}
function trendCell(values, max) {
  const bars = values.map(v => {
    const h = max > 0 ? Math.max(2, Math.round(v / max * 22)) : 2;
    return `<div class="bar" style="height:${h}px;background:${v > 0 ? "var(--text-2)" : "var(--border)"}"></div>`;
  }).join("");
  return `<div class="trend-cell">${bars}</div>`;
}

/* ============================== render: shell ============================== */
// The sheet keeps its scroll position across re-renders (PDF progress,
// toggling rows), and only animates in when it first opens.
let lastSheetKey = null;
function render() {
  const root = document.getElementById("app");
  const oldSheet = root.querySelector(".sheet");
  const sheetScroll = oldSheet ? oldSheet.scrollTop : 0;
  const sheet = renderSheet();
  root.innerHTML = renderHeader() + renderBody() + renderNav() + sheet.html;
  const el = root.querySelector(".sheet");
  if (el) { if (sheet.key === lastSheetKey) el.scrollTop = sheetScroll; else el.classList.add("enter"); }
  lastSheetKey = sheet.key;
  document.body.classList.toggle("sheet-open", !!sheet.key);
  wireOnce();
}

// Reads each picked PDF in turn (password prompts need to happen one at a
// time), then shows the review card. Nothing is saved until "Import".
async function startPdfImport(fileList) {
  const picked = Array.from(fileList);
  if (!picked.length) return;
  ui.syncError = null;
  ui.pdfImport = { busy: true, progress: "Loading the PDF reader…", files: [] };
  render();
  let lib;
  try { lib = await window.DuitPdfImport.loadPdfjs(); }
  catch (err) {
    ui.pdfImport = null;
    ui.syncError = navigator.onLine === false
      ? "PDF import needs a connection the first time it's used on this device. CSV import and paste work offline."
      : "Couldn't load the PDF reader: " + err.message;
    render(); return;
  }
  const results = [], seen = new Set();
  for (let i = 0; i < picked.length; i++) {
    const f = picked[i];
    if (seen.has(f.name)) { results.push({ file: f.name, error: "Picked twice. Only the first copy is used." }); continue; }
    seen.add(f.name);
    ui.pdfImport.progress = `Reading ${f.name} (${i + 1} of ${picked.length})…`;
    render();
    const data = new Uint8Array(await f.arrayBuffer());
    const ask = retry => window.prompt(retry ? `Wrong password for ${f.name}. Try again, or cancel to skip it:` : `${f.name} is password-protected. Enter its password, or cancel to skip it:`);
    results.push(await window.DuitPdfImport.parsePdf(lib, data, f.name, ask));
  }
  ui.pdfImport = { busy: false, files: results.map(r => ({ ...r, include: !r.error && r.checks.every(c => c.ok), open: false })) };
  render();
}

// A month whose card statements are missing reads as a big drop in spend.
// Spot it from the card accounts seen in the three months before it.
function cardAccounts(m) { return new Set((m.transactions || []).map(t => t.account).filter(a => CARD_TYPES.has(a))); }
function missingCards(m) {
  if (!m.cardSpendAvailable || !(m.transactions || []).length) return [];
  const i = appData.months.findIndex(x => x.month === m.month);
  const seen = new Set();
  appData.months.slice(Math.max(0, i - 3), Math.max(0, i)).forEach(p => cardAccounts(p).forEach(a => seen.add(a)));
  const have = cardAccounts(m);
  return [...seen].filter(a => !have.has(a));
}
// Months whose Op-Ex is complete: a card statement, and no card missing.
// Averages use only these; a partial month would pull them down.
function isConfirmed(m) { return m.cardSpendAvailable && !missingCards(m).length; }
function partialMonths(months) { return months.filter(m => m.cardSpendAvailable && missingCards(m).length).map(m => m.month); }
function renderNudge() {
  const latest = appData.months[appData.months.length - 1];
  const missing = missingCards(latest);
  let msg = null;
  if (!latest.cardSpendAvailable) msg = `<strong>${esc(latest.month)}</strong> has no card statement yet. Op-Ex figures skip it.`;
  else if (missing.length) msg = `<strong>${esc(latest.month)}</strong> has no ${esc(missing.join(" or "))} statement yet, so its Op-Ex reads low.`;
  if (!msg) return "";
  return `<div class="card nudge"><p>${msg}</p><button class="btn small primary" data-action="open-add">Import</button></div>`;
}

function bucketSources(m, bucket) {

function renderOverview(filtered) {
  const bucket = ui.bucketOverview;
  const available = filtered.filter(m => m.cardSpendAvailable);
  const confirmed = filtered.filter(isConfirmed);
  const partialCard = partialMonths(filtered);
  const totalIn = filtered.reduce((s, m) => s + m.totalIn, 0);
  const totalOpex = confirmed.reduce((s, m) => s + opexAmount(m), 0);
  const netTotalOpex = confirmed.reduce((s, m) => s + netOpexAmount(m), 0);
  const totalOut = filtered.reduce((s, m) => s + totalOutAdjusted(m), 0);
  const latest = filtered[filtered.length - 1];
  const prev = filtered.length > 1 ? filtered[filtered.length - 2] : null;
  const avgOpex = confirmed.length ? Math.round(totalOpex / confirmed.length) : null;
  const netAvgOpex = confirmed.length ? Math.round(netTotalOpex / confirmed.length) : null;
  const latestMissing = missingCards(latest);
  const delta = (prev && isConfirmed(prev) && isConfirmed(latest)) ? pct(opexAmount(latest), opexAmount(prev)) : null;
  const tone = delta > 15 ? "warn" : delta < -15 ? "ok" : "";
  const latestSub = !latest.cardSpendAvailable ? "no card stmt yet"
    : latestMissing.length ? `partial: no ${latestMissing.join(", ")} yet`
    : delta != null ? `${delta > 0 ? "+" : ""}${delta}% vs prior` : "—";
  const partial = filtered.filter(m => !m.cardSpendAvailable).map(m => m.month);

  // Op-Ex per-month figures divide by confirmed months only, so a partial
  // month (a card statement still missing) doesn't pull the averages down.
  const avgMonths = bucket === "opex" ? confirmed : filtered;
  const totals = {}; const tags = {}; const avgTotals = {};
  filtered.forEach(m => bucketSources(m, bucket).forEach(({ src, tag }) => {
    if (!src) return;
    Object.entries(src).forEach(([k, v]) => { if (k === "Credit Card Payment") return; if (v) { totals[k] = (totals[k] || 0) + v; if (tag) tags[k] = tag; } });
  }));
  avgMonths.forEach(m => bucketSources(m, bucket).forEach(({ src }) => {
    if (src) Object.entries(src).forEach(([k, v]) => { if (k !== "Credit Card Payment" && v) avgTotals[k] = (avgTotals[k] || 0) + v; });
  }));
  const cats = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const colorOf = colorMap(cats.map(([c]) => c));
  const bucketTotal = cats.reduce((s, [, v]) => s + v, 0);
  const maxCat = cats.reduce((m, [, v]) => Math.max(m, v), 0);
  const bucketMonths = avgMonths.length;
  const perMonth = v => bucketMonths ? v / bucketMonths : 0;
  const reimb = bucket === "opex" ? available.reduce((s, m) => s + reimbursementAmount(m), 0) : 0;
  const avgReimb = bucket === "opex" ? confirmed.reduce((s, m) => s + reimbursementAmount(m), 0) : 0;
  const netBucketTotal = bucketTotal - reimb;
  const avgBucketTotal = Object.values(avgTotals).reduce((s, v) => s + v, 0);
  const catValue = (m, cat) => bucketSources(m, bucket).reduce((s, { src }) => s + ((src || {})[cat] || 0), 0);
  const hasLatest = bucket === "opex" ? latest.cardSpendAvailable : true;
  const hasPrev = prev && (bucket === "opex" ? prev.cardSpendAvailable : true);

  const monthRows = filtered.map(m => {
    const srcs = bucketSources(m, bucket);
    const merged = {};
    srcs.forEach(({ src }) => { if (src) Object.entries(src).forEach(([k, v]) => { if (k !== "Credit Card Payment" && v) merged[k] = (merged[k] || 0) + v; }); });
    const entries = Object.entries(merged).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [, v]) => s + v, 0);
    const isPartial = bucket === "opex" && !m.cardSpendAvailable;
    const missingCard = bucket === "opex" && partialCard.includes(m.month);
    return `<div class="month-row">
      <div class="month-head"><span class="month-label">${esc(m.month)}${missingCard ? '<span class="tag">partial</span>' : ""}</span><span class="month-total">${isPartial ? "—" : esc(fmt(total))}</span></div>
      ${isPartial ? `<div class="stacked-bar empty"></div>` : stackedBar(entries, total, colorOf)}
    </div>`;
  }).join("");

  const catRows = cats.map(([cat, total]) => {
    const latestVal = hasLatest ? catValue(latest, cat) : null;
    const prevVal = hasPrev ? catValue(prev, cat) : null;
    const d = (latestVal != null && prevVal != null) ? latestVal - prevVal : null;
    const barPct = total > 0 && maxCat > 0 ? Math.min(100, total / maxCat * 100).toFixed(0) : "0";
    const deltaHtml = d != null && Math.abs(d) > 0.5
      ? `<span class="row2-delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${esc(fmt(Math.abs(d)))}</span>`
      : `<span class="row2-delta flat">—</span>`;
    return `<div class="row2">
      <div class="row2-top">
        <span class="swatch" style="background:${colorOf(cat)}"></span>
        <span class="row2-name">${esc(cat)}${tags[cat] ? `<span class="tag">${esc(tags[cat])}</span>` : ""}</span>
        <span class="row2-amt">${esc(fmt(perMonth(avgTotals[cat] || 0)))}<small>/mo</small></span>
      </div>
      <div class="row2-bottom">
        <div class="row2-bar"><div class="row2-bar-fill" style="width:${barPct}%;background:${colorOf(cat)}"></div></div>
        <span class="row2-total">${esc(fmt(total))} tot</span>
        ${deltaHtml}
      </div>
    </div>`;
  }).join("");

  const reimbRow = (bucket === "opex" && reimb > 0) ? `
    <div class="row2">
      <div class="row2-top">
        <span class="swatch" style="background:var(--success)"></span>
        <span class="row2-name">Reimbursement<span class="tag">Offset</span></span>
        <span class="row2-amt" style="color:var(--success)">${esc(fmt(perMonth(-avgReimb)))}<small>/mo</small></span>
      </div>
      <div class="row2-bottom"><div class="row2-bar"></div><span class="row2-total">${esc(fmt(-reimb))} total</span></div>
    </div>
    <div class="row2" style="font-weight:600;">
      <div class="row2-top"><span class="row2-name" style="font-weight:600;">Net Op-Ex</span>
        <span class="row2-amt">${esc(fmt(perMonth(avgBucketTotal - avgReimb)))}<small>/mo</small></span></div>
      <div class="row2-bottom"><span class="row2-total">${esc(fmt(netBucketTotal))} total</span></div>
    </div>` : "";

  return `
  <div class="metrics">
    <div class="metric ${tone}">
      <div class="metric-label">${esc(latest.month)} Op-Ex</div>
      <div class="metric-value">${latest.cardSpendAvailable ? esc(fmt(opexAmount(latest))) : "Pending"}</div>
      <div class="metric-sub">${esc(latestSub)}</div>
    </div>
    <div class="metric"><div class="metric-label">Avg Op-Ex / mo</div><div class="metric-value">${avgOpex != null ? esc(fmt(avgOpex)) : "—"}</div><div class="metric-sub">${confirmed.length} month${confirmed.length !== 1 ? "s" : ""} confirmed${partialCard.length ? ` &middot; ${esc(partialCard.map(mo => mo.split(" ")[0]).join(", "))} partial` : ""}</div></div>
    <div class="metric"><div class="metric-label">Net Op-Ex / mo</div><div class="metric-value">${netAvgOpex != null ? esc(fmt(netAvgOpex)) : "—"}</div><div class="metric-sub">after reimbursements</div></div>
    <div class="metric"><div class="metric-label">Total out</div><div class="metric-value">${esc(fmt(totalOut))}</div><div class="metric-sub">${!ui.hideIncome ? `in ${esc(fmt(totalIn))}` : `${filtered.length} month${filtered.length !== 1 ? "s" : ""}`}${partial.length ? ` &middot; excl. ${esc(partial.join(", "))}` : ""}</div></div>
  </div>
  <div class="card">
    <p class="card-title">Monthly spend pattern</p>
    ${bucketToggle("bucketOverview", bucket)}

    ${monthRows}

    ${bucketToggle("bucketOverview", bucket)}
    ${cats.length === 0 ? `<div style="font-size:14px;color:var(--text-2);">No data available for this view.</div>` : catRows + reimbRow}
  </div>`;
}

/* ============================== install & updates ============================== */
// Chrome's menu install can say "already installed" when another app on hariadityaa.github.io
// is installed. The page prompt checks this app's scope correctly, so offer it in the page.
const INSTALL_DECLINED = "duitbijak.installDeclined";
const pwa = { installEvent: null, installDeclined: false, updateReady: false };
try { pwa.installDeclined = localStorage.getItem(INSTALL_DECLINED) === "1"; } catch (e) {}
function isStandalone() { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pwa.installEvent = e; render(); });
window.addEventListener("appinstalled", () => { pwa.installEvent = null; render(); });

// A new deploy ships a new sw.js. It installs, takes over at once and fires
// controllerchange. The open page still runs the old code, so offer a reload.
// The installed app can sit in the background for days, so check on return.
const UPDATE_CHECK_MS = 30 * 60 * 1000;
function watchForUpdates() {
  if (!("serviceWorker" in navigator)) return;
  const sw = navigator.serviceWorker;
  // The first install also fires controllerchange. That is not an update.
  let hadController = !!sw.controller;
  sw.addEventListener("controllerchange", () => {
    if (hadController) { pwa.updateReady = true; render(); }
    hadController = true;
  });
  sw.register("sw.js").then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, UPDATE_CHECK_MS);
  }).catch(() => {});
}

/* ============================== events ============================== */
let wired = false;
function wireOnce() {
  if (wired) return; wired = true;
  const root = document.getElementById("app");
  root.addEventListener("click", onClick);
  root.addEventListener("change", onChange);
  // Search re-renders only the list, so the input keeps focus and the keyboard stays up.
  root.addEventListener("input", e => {
    if (e.target.id !== "tx-search") return;
    ui.txQuery = e.target.value; ui.txLimit = 0;
    const list = document.getElementById("tx-list");
    if (list) list.innerHTML = renderTxList();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.sheet || ui.pdfImport) && !(ui.pdfImport && ui.sheet !== "settings")) { ui.sheet = null; render(); } });
  // The FAB hides while scrolling down through content and returns on scroll up.
  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY, hide = y > lastY && y > 80;
    if (Math.abs(y - lastY) < 8) return;
    lastY = y;
    if (hide === fabHidden) return;
    fabHidden = hide;
    const fab = document.querySelector(".fab");
    if (fab) fab.classList.toggle("hidden", hide);
  }, { passive: true });
}
let fabHidden = false;
function onChange(e) {
  const t = e.target;
  if (t.id === "from-select") { ui.fromIdx = Number(t.value); if (ui.fromIdx > ui.toIdx) ui.toIdx = ui.fromIdx; render(); }
  else if (t.id === "to-select") { ui.toIdx = Number(t.value); if (ui.toIdx < ui.fromIdx) ui.fromIdx = ui.toIdx; render(); }
  else if (t.id === "csv-file-input") {
    const file = t.files && t.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => ingestText(String(reader.result || ""), ` from ${file.name}`, false);
    reader.onerror = () => { ui.syncError = `Couldn't read ${file.name}.`; render(); };
    reader.readAsText(file);
    t.value = "";
  }
  else if (t.id === "pdf-file-input") {
    const files = t.files;
    startPdfImport(files).catch(err => { ui.pdfImport = null; ui.syncError = "PDF import failed: " + err.message; render(); });
  }
}
// Shared by both the paste textarea and the CSV file import: parses the text,
// saves the resulting months, and reports the outcome the same way either path.
// Pasted text is kept in the box on failure so it can be fixed, not re-pasted.
function ingestText(text, sourceSuffix, fromPaste) {
  let parsedMonths;
  try { parsedMonths = syncFromText(text); }
  catch (err) { ui.syncError = err.message; if (fromPaste) ui.pasteDraft = text; render(); return; }
  persistMonths(parsedMonths).then(() => {
    ui.sheet = null; ui.syncError = null; ui.pasteDraft = "";
    if (!dbApi) ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
    showToast(`Loaded ${parsedMonths.length} month${parsedMonths.length !== 1 ? "s" : ""}${sourceSuffix}.`);
    render();
  }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; if (fromPaste) ui.pasteDraft = text; render(); });
}
function onClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  if (action !== "clear-data") ui.confirmClear = false;

  if (action === "close-sheet") {
    // The backdrop carries this action too; only a tap on the backdrop itself closes.
    if (btn.classList.contains("sheet-backdrop") && e.target !== btn) return;
    ui.sheet = null; ui.keyTest = null; ui.selectedCat = null; render();
  }
  else if (action === "set-tab") { ui.tab = btn.getAttribute("data-tab"); ui.selectedCat = null; ui.txLimit = 0; render(); window.scrollTo(0, 0); }
  else if (action === "open-add") { ui.sheet = "add"; ui.selectedCat = null; ui.syncError = null; render(); }
  else if (action === "open-sheet") {
    ui.sheet = btn.getAttribute("data-sheet"); render();
    const ta = document.getElementById("paste-input"); if (ta) ta.focus();
  }
  else if (action === "set-preset") { [ui.fromIdx, ui.toIdx] = presetRange(btn.getAttribute("data-preset")); ui.customPeriod = false; ui.txLimit = 0; render(); }
  else if (action === "custom-period") { ui.customPeriod = true; render(); }
  else if (action === "tx-more") { ui.txLimit = (ui.txLimit || TX_PAGE) + TX_PAGE; const list = document.getElementById("tx-list"); if (list) list.innerHTML = renderTxList(); }
  else if (action === "apply-update") { location.reload(); }
  else if (action === "install-app") {
    const ev = pwa.installEvent;
    pwa.installEvent = null; render();
    if (ev) ev.prompt().catch(() => {});
  }
  else if (action === "decline-install") {
    pwa.installDeclined = true;
    try { localStorage.setItem(INSTALL_DECLINED, "1"); } catch (e) {}
    render();
  }
  else if (action === "toggle-income") { ui.hideIncome = !ui.hideIncome; render(); }
  else if (action === "set-bucket") { ui[btn.getAttribute("data-key")] = btn.getAttribute("data-value"); ui.selectedCat = null; render(); }
  else if (action === "select-cat") { const c = btn.getAttribute("data-cat"); ui.selectedCat = c; render(); }
  else if (action === "clear-data") {
    if (ui.confirmClear) {
      const storage = ui.storage;
      clearAllData().then(() => {
        ui = { tab: "overview", fromIdx: 0, toIdx: 0, hideIncome: true, bucketOverview: "opex", bucketDeep: "opex", selectedCat: null, sheet: null, customPeriod: false, txQuery: "", txLimit: 0, syncError: null, lastSynced: null, storage };
        showToast("Data cleared.");
        render();
      }).catch(err => { ui.syncError = "Couldn't clear data: " + err.message; render(); });
    } else { ui.confirmClear = true; render(); }
  }
  else if (action === "process-paste") {
    const ta = document.getElementById("paste-input");
    const text = ta ? ta.value : "";
    if (!text.trim()) return;
    btn.disabled = true; btn.textContent = "Processing…";
    ingestText(text, "", true);
  }
  else if (action === "trigger-csv-import") {
    const input = document.getElementById("csv-file-input");
    if (input) input.click();
  }
  else if (action === "trigger-pdf-import") {
    const input = document.getElementById("pdf-file-input");
    if (input) input.click();
  }
  else if (action === "pdf-toggle-file" || action === "pdf-toggle-rows") {
    const f = ui.pdfImport && ui.pdfImport.files[Number(btn.getAttribute("data-idx"))];
    if (!f) return;
    if (action === "pdf-toggle-file") f.include = !f.include; else f.open = !f.open;
    render();
  }
  else if (action === "pdf-cancel") { ui.pdfImport = null; render(); }
  else if (action === "pdf-gemini" || action === "pdf-gemini-consent" || action === "pdf-gemini-cancel") {
    const f = ui.pdfImport && ui.pdfImport.files[Number(btn.getAttribute("data-idx"))];
    if (!f || !f.pages || f.geminiBusy) return;
    if (action === "pdf-gemini-cancel") { f.askConsent = false; render(); return; }
    if (action === "pdf-gemini-consent") { try { DuitGemini.giveConsent(); } catch (e) {} }
    else if (!DuitGemini.hasConsent()) { f.askConsent = true; render(); return; }
    readWithGemini(f).catch(err => { f.geminiBusy = false; f.geminiError = "Gemini read failed: " + err.message; render(); });
  }
  else if (action === "open-settings") { ui.sheet = "settings"; ui.keyTest = null; render(); }
  else if (action === "save-key") {
    const input = document.getElementById("gemini-key-input");
    const key = input ? input.value.trim() : "";
    if (!key) { showToast("Paste a key first."); return; }
    try { DuitGemini.saveKeys({ ...DuitGemini.loadKeys(), gemini: key }); }
    catch (e) { showToast("Couldn't save the key in this browser."); return; }
    ui.keyTest = null; showToast("Gemini key saved."); render();
  }
  else if (action === "test-key") {
    const key = DuitGemini.loadKeys().gemini;
    if (!key) return;
    ui.keyTest = { busy: true }; render();
    DuitGemini.testKey(key).then(r => { ui.keyTest = r; render(); });
  }
  else if (action === "clear-key") {
    try { DuitGemini.clearKeys(); } catch (e) {}
    ui.keyTest = null; showToast("Gemini key cleared."); render();
  }
  else if (action === "copy-setup-link") {
    const key = DuitGemini.loadKeys().gemini;
    if (!key) return;
    const link = DuitGemini.buildSetupLink(location.href, { gemini: key });
    const fallback = () => window.prompt("Copy this setup link. It contains your key, so send it privately:", link);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(() => showToast("Setup link copied. Send it privately."), fallback);
    else fallback();
  }
  else if (action === "pdf-commit") {
    const st = ui.pdfImport;
    if (!st || st.busy) return;
    const rows = pdfSelectedRows();
    const fileCount = st.files.filter(f => f.include).length;
    if (!rows.length) return;
    btn.disabled = true; btn.textContent = "Importing…";
    persistMonths(planImport(rows).months).then(() => {
      ui.pdfImport = null; ui.sheet = null; ui.syncError = null;
      if (!dbApi) ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
      showToast(`Imported ${rows.length} rows from ${fileCount} file${fileCount !== 1 ? "s" : ""}.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "save-month") {
    const v = id => document.getElementById(id);
    const month = (v("f-month").value || "").trim();
    if (!month) { showToast("Enter a month name first."); return; }
    const salary = Number(v("f-salaryIn").value) || 0, otherIn = Number(v("f-otherIn").value) || 0;
    const cardSpend = Number(v("f-cardSpend").value) || 0, giroOut = Number(v("f-giroOut").value) || 0, otherOut = Number(v("f-otherOut").value) || 0;
    const available = v("f-cardAvailable").value === "yes";
    const categories = {};
    CATEGORY_FIELDS.forEach(([key, label]) => { categories[label] = Number(v(`f-${key}`).value) || 0; });
    const newMonth = {
      month, salaryIn: salary, otherIn, totalIn: salary + otherIn,
      cardSpend: available ? cardSpend : null, cardSpendAvailable: available,
      giroOut, otherOut, totalOut: available ? cardSpend + giroOut + otherOut : round2(giroOut + otherOut),
      categories: available ? categories : null,
      giroCategories: { ...DEFAULT_GIRO }, otherCategories: {}, topMerchants: [], transactions: [],
    };
    btn.disabled = true; btn.textContent = "Saving…";
    persistMonths([newMonth]).then(() => {
      ui.tab = "overview"; ui.sheet = null;
      if (!dbApi) ui.lastSynced = new Date().toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit" });
      showToast(`${month} saved.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "add-fixed") {
    const nameEl = document.getElementById("f-fixed-name");
    const amtEl = document.getElementById("f-fixed-amount");
    const name = (nameEl.value || "").trim();
    const amount = Number(amtEl.value);
    if (!name) { showToast("Enter a name first."); return; }
    if (!amount || amount <= 0) { showToast("Enter an amount."); return; }
    persistFixedCommitment(name, round2(amount)).then(() => {
      showToast(`${name} added.`);
      render();
    }).catch(err => { ui.syncError = "Couldn't save that: " + err.message; render(); });
  }
  else if (action === "delete-fixed") {
    const name = btn.getAttribute("data-name");
    deleteFixedCommitment(name).then(() => render()).catch(err => { ui.syncError = "Couldn't delete that: " + err.message; render(); });
  }
}

/* ============================== init ============================== */
if (consumeSetupLink()) { ui.sheet = "settings"; showToast("Gemini key saved from setup link."); }
render();
initPersistence();
watchForUpdates();
})();
</script>
