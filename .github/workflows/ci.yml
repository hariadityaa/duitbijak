name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and wiring checks
        run: node scripts/check.js
      - name: Tests
        run: |
          for f in tests/*.test.js; do
            echo "== $f"
            node "$f" || exit 1
          done
      # Pages serves this branch as-is, so nothing stamps a version at deploy.
      # Without a new sw.js, installed copies never see the update.
      - name: Service worker version bumped
        if: github.event_name == 'pull_request'
        run: |
          base=${{ github.event.pull_request.base.sha }}
          changed=$(git diff --name-only "$base" HEAD | grep -E '^(index\.html|manifest\.json|icons/|vendor/|[a-z-]+\.js$)' || true)
          [ -z "$changed" ] && { echo "App files unchanged."; exit 0; }
          old=$(git show "$base:sw.js" | grep -o 'duit-bijak-v[0-9]*')
          new=$(grep -o 'duit-bijak-v[0-9]*' sw.js)
          echo "Changed: $changed"
          echo "CACHE_NAME: $old -> $new"
          [ "$old" != "$new" ] || { echo "::error file=sw.js::App files changed. Bump CACHE_NAME in sw.js."; exit 1; }
