name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check scripts
        run: |
          node --check sw.js
          node --check pdf-import.js
          node --check gemini-parse.js
          node --check categorise.js
          node -e '
            const html = require("fs").readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) throw new Error("no inline script found");
            scripts.forEach(s => new Function(s));
          '
          node -e 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8"))'
      - name: PDF parser tests
        run: node tests/pdf-import.test.js
      - name: Gemini fallback tests
        run: node tests/gemini-parse.test.js
      - name: Categoriser tests
        run: node tests/categorise.test.js
      # Pages serves this branch as-is, so nothing stamps a version at deploy.
      # Without a new sw.js, installed copies never see the update.
      - name: Service worker version bumped
        if: github.event_name == 'pull_request'
        run: |
          base=${{ github.event.pull_request.base.sha }}
          changed=$(git diff --name-only "$base" HEAD -- index.html manifest.json icons sw.js pdf-import.js gemini-parse.js categorise.js vendor)
          [ -z "$changed" ] && { echo "App files unchanged."; exit 0; }
          old=$(git show "$base:sw.js" | grep -o 'duit-bijak-v[0-9]*')
          new=$(grep -o 'duit-bijak-v[0-9]*' sw.js)
          echo "Changed: $changed"
          echo "CACHE_NAME: $old -> $new"
          [ "$old" != "$new" ] || { echo "::error file=sw.js::App files changed. Bump CACHE_NAME in sw.js."; exit 1; }
